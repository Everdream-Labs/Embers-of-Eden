<style>
/* ---------- Team Maps ---------- */
.tm-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:12px 0 18px}
.tm-card{--mc:#888;border:1px solid var(--line-2);border-top:3px solid var(--mc);background:rgba(0,0,0,.3);cursor:pointer;text-align:center;color:var(--ink);padding:0;font-family:var(--font-body);display:flex;flex-direction:column;transition:transform .15s,border-color .15s,box-shadow .15s}
.tm-card:hover{transform:translateY(-2px);border-color:var(--mc)}
.tm-card.cur{box-shadow:0 0 0 1px var(--mc),0 0 26px -6px var(--mc)}
.tm-thumb{position:relative;aspect-ratio:1/1;background:#0b0a08;overflow:hidden}
.tm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tm-wait{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font-family:var(--font-type);font-size:.74rem;color:var(--ink-dim);text-align:center;padding:10px}
.tm-wait .sig{width:34px;height:34px;opacity:.5;animation:pulse 1.6s ease-in-out infinite}
.tm-body{padding:8px 10px 10px}
.tm-body b{display:block;font-family:var(--font-head);letter-spacing:.14em;text-transform:uppercase;font-weight:500;font-size:.9rem;color:color-mix(in srgb,var(--mc) 70%,#fff)}
.tm-who{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:3px;font-family:var(--font-head);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.tm-who .sig{width:14px;height:14px;color:var(--mc)} .tm-who .flag{width:11px;height:16px}
.feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;border:1px solid var(--line-2);border-top:3px solid var(--mc);background:rgba(0,0,0,.26);padding:16px;margin-bottom:22px}
.feature h3{margin:0;font-family:var(--font-head);font-size:1.8rem;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--mc) 75%,#fff);text-align:center}
.feature .tag{text-align:center;font-family:var(--font-type);color:var(--ink-dim);margin:2px 0 10px}
.feature .desc{text-align:center;margin:0 0 12px;font-size:.94rem}
.big-prev{position:relative;aspect-ratio:1/1;border:1px solid var(--line-2);background:#0b0a08;overflow:hidden;cursor:zoom-in}
.big-prev img{width:100%;height:100%;object-fit:cover;display:block}
.big-prev .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,9,8,.8);border:1px solid var(--line-2);padding:3px 12px;font-family:var(--font-head);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);white-space:nowrap;text-align:center}
.recipe{font-family:var(--font-type);font-size:.76rem;color:var(--ink-dim);text-align:center;margin:8px 0 4px;word-break:break-word}
.fp{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:var(--font-head);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line-2);padding:2px 9px;color:var(--ink-dim);text-align:center}
.fp.ok{color:#cfe8a8;border-color:color-mix(in srgb,var(--good) 60%,transparent)} .fp.bad{color:#f2b2a6;border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.crisis-row{display:grid;grid-template-columns:110px 92px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}

/* ---------- World Rules ---------- */
.vgrid .vcard.wide{grid-column:span 2}

.btab td.nm{font-family:var(--font-head);letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;white-space:nowrap}
.btab td.nm i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.5)}

.cycle span{border:1px solid var(--line-2);background:rgba(0,0,0,.3);padding:3px 9px;font-family:var(--font-head);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.cycle span.hot{border-color:#d9a24a;color:#f1d18f} .cycle span.wet{border-color:#5fb3c4;color:#bfe6ee}

<script>
const PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
/* ---------- Pictures: Name.jpg, Name1.jpg, Name2.jpg … — click a picture to cycle the shortlist ---------- */
const IMG = (() => {
  const EXT = ["jpg", "png", "webp", "jpeg"];
  const EMB = window.EDEN_IMAGES || null;
  const KEY = "edenCodex.pictures";
  const cache = {};
  let pick = {};
  try { pick = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const stemOf = p => String(p || "").replace(/\.(jpe?g|png|webp)$/i, "");
  const src = p => (EMB && EMB[p]) || encodeURI(p).replace(/#/g, "%23");
  const probe = p => new Promise(res => {
    if (EMB) return res(!!EMB[p]);
    const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src(p);
  });
  async function at(stem, n) { for (const e of EXT) { const p = `${stem}${n || ""}.${e}`; if (await probe(p)) return p; } return null; }
  function list(stem) {
    if (!cache[stem]) cache[stem] = (async () => {
      const out = [], first = await at(stem, 0);
      if (first) out.push(first);
      for (let n = 1; n < 40; n++) { const p = await at(stem, n); if (!p) break; out.push(p); }
      return out;
    })();
    return cache[stem];
  }
  function badge(img, i, n) {
    const host = img.parentNode; if (!host) return;
    let b = host.querySelector(":scope > .pic-count");
    if (n < 2) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement("span"); b.className = "pic-count"; host.appendChild(b); }
    b.textContent = `${i + 1} / ${n} · click to cycle`;
  }
  async function hydrate(img) {
    if (img.dataset.ready) return;
    img.dataset.ready = "1";
    const stem = img.dataset.stem, paths = await list(stem);
    if (!paths.length) { img.remove(); return; }
    const i = (pick[stem] || 0) % paths.length;
    img.onload = () => { if (img.parentNode) img.parentNode.classList.add("has-img"); };
    img.src = src(paths[i]);
    if (img.hasAttribute("data-cycle")) badge(img, i, paths.length);
  }
  async function cycle(img) {
    const stem = img.dataset.stem, paths = await list(stem);
    const file = stem.split("/").pop();
    if (paths.length < 2) { toast(`Only one picture — add ${file}1.jpg, ${file}2.jpg… to shortlist more`); return; }
    const i = ((pick[stem] || 0) + 1) % paths.length;
    pick[stem] = i;
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {}
    document.querySelectorAll(`img[data-stem="${CSS.escape(stem)}"]`).forEach(x => { x.src = src(paths[i]); if (x.hasAttribute("data-cycle")) badge(x, i, paths.length); });
    SFX.play("shutter");
    toast(`Picture ${i + 1} of ${paths.length} — ${paths[i].split("/").pop()}`);
  }
  document.addEventListener("click", e => {
    const img = e.target.closest && e.target.closest("img[data-cycle]");
    if (!img) return;
    e.stopPropagation(); e.preventDefault();
    cycle(img);
  }, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.matches("img[data-stem]")) hydrate(n);
    n.querySelectorAll("img[data-stem]").forEach(hydrate);
  }))).observe(document.documentElement, { childList: true, subtree: true });
  return {
    tag: (path, cycleIt, alt) => `<img data-stem="${esc(stemOf(path))}"${cycleIt ? " data-cycle" : ""} alt="${esc(alt || "")}">`,
    hint: path => `add “${path}” — or ${stemOf(path).split("/").pop()}1, 2, 3… to shortlist`,
    snapshot: () => Object.assign({}, pick),
    seed: obj => { if (obj) Object.entries(obj).forEach(([k, v]) => { if (!(k in pick)) pick[k] = v; }); }
  };
})();

/* ==========================================================================
   DATA — mirrors Data/Maps_of_Eden.md (city-builder pivot, Visions of Eden is the source of truth).
   "(suggestion)" = idea, not agreed. Team map "forge" blocks are World Forge recipes (seed + theme + sliders).
   ========================================================================== */
const DEFAULT_DATA = {
  meta: { dataRev: "citybuilder-2026-11-03a", updated: "2026-11-03", source: "Data/Maps_of_Eden.md" },
  tabs: [
    { id: "maps", label: "Team Maps", color: "#93b85c" },
    { id: "forge", label: "World Forge", color: "#e0913a" },
    { id: "rules", label: "World Rules", color: "#7fa6c9" }
  ],
  teams: [
    { id: "survivors", name: "Survivors", leaders: "Viktor & Ayla", color: "#8b9096", identity: "Neutral jack-of-all-trades — good at everything, best at nothing." },
    { id: "hunters", name: "The Hunters", leaders: "Brick & Twig", color: "#a3a84e", identity: "Western homesteaders — food, animals, wood and stone." },
    { id: "militia", name: "Militia", leaders: "Militia Brother & Sister (names TBD)", color: "#a4ae74", identity: "Heavy industry, power and advanced weaponry up to plasma." },
    { id: "ashen", name: "Ashen", leaders: "Blowtorch & Vesper", color: "#ff5a1f", identity: "Fire, mining and smelting — and the dark economy." },
    { id: "droids", name: "Droids", leaders: "Droid 0001", color: "#4fb0ff", identity: "No food — power is their food. A huge grid, many unique rules." }
  ],

  $("#legend").innerHTML = `<span class="dim">Source of truth: ${esc(DATA.meta.source)} · Updated ${esc(DATA.meta.updated)} · Keys 1–3 switch tabs · Esc closes · Forge previews are generated concepts, not final art</span>`;
  FX.set([{ mode: tid ? TEAM_FX[tid] : "embers", color: tm ? tm.color : t.color }, { mode: "ash", color: "#bdb5a6" }]);
  try { history.replaceState(null, "", t.id === "maps" ? `#map/${state.map}` : t.id === "forge" ? `#forge/${recipeCode(FORGE.recipe)}` : "#rules"); } catch (e) {}
  applyEditable();
  if (t.id === "forge") requestAnimationFrame(forgeMount);
  if (t.id === "maps") { const cur = TMAP(state.map); if (cur) queuePreview(cur.forge, true); DATA.teamMaps.forEach(x => queuePreview(x.forge)); }
}
function routeHash() {
  const raw = decodeURIComponent(location.hash.slice(1)), parts = raw.split("/");
  if (parts[0] === "map" || parts[0] === "maps") { state.tab = "maps"; if (TMAP(parts[1])) state.map = parts[1]; return true; }
  if (parts[0] === "forge") { state.tab = "forge"; const r = codeRecipe(parts.slice(1).join("/")); if (r) FORGE.recipe = r; return true; }
  if (parts[0] === "rules") { state.tab = "rules"; return true; }
  if (TMAP(parts[0])) { state.tab = "maps"; state.map = parts[0]; return true; }
  return false;
}
addEventListener("hashchange", () => {
  const before = state.tab + state.map + recipeCode(FORGE.recipe);
  if (routeHash() && before !== state.tab + state.map + recipeCode(FORGE.recipe)) renderAll();
});

/* ---------- modal, edit mode, toast ---------- */
function openModal(html, wide) {
  if (!quiet) SFX.play("modalOpen");
  $("#modal-box").classList.toggle("wide", !!wide);
  const b = $("#modal-body"), keep = quiet ? b.scrollTop : 0;
  b.innerHTML = html; b.scrollTop = keep;
  $("#modal").classList.add("open"); applyEditable();
}
function closeModal() { const o = $("#modal").classList.contains("open"); $("#modal").classList.remove("open"); reopen = null; if (o) { SFX.play("modalClose"); if (state.editing) renderAll(); } }
const PLAIN = (() => { const d = document.createElement("div"); try { d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only"; } catch (e) { return false; } })();
function applyEditable() { $$("[data-edit]").forEach(el => { if (state.editing) { el.setAttribute("contenteditable", PLAIN ? "plaintext-only" : "true"); el.spellcheck = true; } else el.removeAttribute("contenteditable"); }); }
function toggleEdit() {
  state.editing = !state.editing;
  document.body.classList.toggle("editing", state.editing);
  $("#btn-edit").classList.toggle("active", state.editing);
  SFX.play("tab", { pitch: state.editing ? 1.15 : 0.88 });
  refresh(); toast(state.editing ? "Edit mode on" : "Edit mode off");
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400); }
document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (!el || !state.editing) return;
  const v = el.innerText.replace(/\u00a0/g, " ").trim();
  if (getPath(DATA, el.dataset.edit) === v) return;
  setPath(DATA, el.dataset.edit, v); persist("Saved");
});
document.addEventListener("click", e => { if (state.editing && e.target.closest && e.target.closest("[data-edit]") && e.target.closest(".tm-card,.lib-item")) e.stopPropagation(); }, true);
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (el && el.isContentEditable) { if (e.key === "Enter" && !el.hasAttribute("data-ml")) { e.preventDefault(); el.blur(); } if (e.key === "Escape") el.blur(); return; }
  if (e.key === "Escape") return closeModal();
  if ($("#modal").classList.contains("open") || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= DATA.tabs.length) go(DATA.tabs[n - 1].id);
});

/* ---------- UI sounds — procedural Web Audio with a warm room tone; one mute shared across books ---------- */
const SFX = (() => {
  let ctx = null, out = null, muted = false;
  try { muted = (localStorage.getItem("edenCodex.mute") ?? localStorage.getItem("warlordsOfEden.mute")) === "1"; } catch (e) {}
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ensure() {
    if (reduce) return Promise.resolve();
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25;
      out = ctx.createGain(); out.gain.value = 0.5;
      const send = ctx.createGain(), dl = ctx.createDelay(0.5), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
      send.gain.value = 0.22; dl.delayTime.value = 0.09; fb.gain.value = 0.35; lp.type = "lowpass"; lp.frequency.value = 2200;
      out.connect(comp); out.connect(send); send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(comp);
      comp.connect(ctx.destination);
    }
    return ctx.state === "suspended" ? ctx.resume() : Promise.resolve();
  }
  document.addEventListener("pointerdown", () => { ensure(); }, { once: true, passive: true });
  function env(g, t, peak, atk, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(f, t, dur, peak, type, f2) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.connect(g); g.connect(out); env(g, t, peak, Math.min(0.01, dur / 4), dur); o.start(t); o.stop(t + dur + 0.05);
  }
  function pluck(f, t, dur, peak) { tone(f, t, dur, peak, "triangle"); tone(f * 2.003, t, dur * 0.6, peak * 0.25, "sine"); }
  function hiss(t, dur, peak, type, f1, f2, q) {
    const n = Math.ceil(ctx.sampleRate * (dur + 0.05)), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; fl.type = type; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    fl.Q.value = q || 1;
    s.connect(fl); fl.connect(g); g.connect(out); env(g, t, peak, Math.min(0.02, dur / 3), dur); s.start(t); s.stop(t + dur + 0.05);
  }
  const KIT = {
    tab: (t, p) => { hiss(t, 0.035, 0.16, "bandpass", 2400 * p, 0, 5); pluck(587 * p, t + 0.005, 0.12, 0.07); },
    back: t => { pluck(659, t, 0.12, 0.06); pluck(494, t + 0.07, 0.16, 0.06); hiss(t, 0.12, 0.05, "bandpass", 1200, 500, 2); },
    modalOpen: t => { hiss(t, 0.22, 0.07, "bandpass", 380, 1700, 1.4); tone(92, t, 0.24, 0.16, "sine", 52); pluck(880, t + 0.06, 0.4, 0.03); },
    modalClose: t => { hiss(t, 0.14, 0.055, "bandpass", 1500, 420, 1.6); tone(330, t, 0.12, 0.045, "sine", 220); },
    select: (t, p) => { pluck(523 * p, t, 0.22, 0.08); pluck(784 * p, t + 0.065, 0.3, 0.065); },
    node: (t, p) => { hiss(t, 0.025, 0.08, "highpass", 3200, 0, 0.8); pluck(740 * p, t, 0.14, 0.055); },
    toggle: (t, p, on) => { if (on) { pluck(523, t, 0.15, 0.06); pluck(784, t + 0.07, 0.2, 0.06); } else { pluck(784, t, 0.15, 0.05); pluck(523, t + 0.07, 0.2, 0.05); } },
    save: t => [523, 659, 784, 1047].forEach((f, i) => pluck(f, t + i * 0.08, 0.45, 0.055)),
    shutter: t => { hiss(t, 0.018, 0.14, "bandpass", 3000, 0, 3); hiss(t + 0.06, 0.022, 0.1, "bandpass", 2200, 0, 3); pluck(1175, t + 0.06, 0.08, 0.025); }
  };
  function play(kind, opts, flagOn) {
    if (muted || reduce || (typeof quiet !== "undefined" && quiet)) return;
    const fn = KIT[kind];
    if (!fn) return;
    ensure().then(() => { if (ctx) fn(ctx.currentTime + 0.005, (opts && opts.pitch) || 1, flagOn == null ? !muted : flagOn); }).catch(() => {});
  }
  function sync() {
    const b = document.getElementById("btn-sound");
    if (!b) return;
    b.textContent = muted ? "\u{1F507} Muted" : "\u{266A} Sound";
    b.classList.toggle("active", !muted);
    b.title = muted ? "UI sounds off — click to enable" : "UI sounds on — click to mute";
  }
  function toggleMute() { muted = !muted; try { localStorage.setItem("edenCodex.mute", muted ? "1" : "0"); } catch (e) {} sync(); if (!muted) play("toggle"); }
  return { play, toggleMute, sync };
})();

/* ---------- atmosphere particles ---------- */
const FX = (() => {
  const cv = $("#fx"), cx = cv.getContext("2d");
  const N = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0 : 100;
  let w = 0, h = 0, parts = [], cfg = [], sig = "", raf = 0;
  const R = (a, b) => a + Math.random() * (b - a);
  function resize() { const d = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight; cv.width = w * d; cv.height = h * d; cv.style.width = w + "px"; cv.style.height = h + "px"; cx.setTransform(d, 0, 0, d, 0, 0); }
  function make(i, init) {
    const c = cfg[i % cfg.length], p = { m: c.mode, c: c.color, t: 0, life: R(320, 900), a: R(.3, .85), s: R(1, 2.6), ph: R(0, 6.28), vx: 0, vy: 0 };
    if (p.m === "embers") { p.x = R(0, w); p.y = init ? R(0, h) : h + R(0, 40); p.vx = R(-.2, .2); p.vy = -R(.35, 1.3); }
    else if (p.m === "dust") { p.x = init ? R(0, w) : -R(0, 60); p.y = R(0, h); p.vx = R(.8, 2.6); p.vy = R(-.15, .15); p.a = R(.1, .35); }
    else { p.x = R(0, w); p.y = init ? R(0, h) : -R(0, 40); p.vx = R(-.25, .35); p.vy = R(.25, .7); p.a = R(.15, .45); if (p.m === "ash" && Math.random() < .7) p.c = "#bdb5a6"; }
    return p;
  }
  function tick() {
    cx.clearRect(0, 0, w, h);
    parts.forEach((p, i) => {
      p.t++; p.x += p.vx + Math.sin(p.t / 45 + p.ph) * .3; p.y += p.vy;
      if (p.y < -90 || p.y > h + 90 || p.x < -90 || p.x > w + 90 || p.t > p.life) { parts[i] = make(i, false); return; }
      const fade = Math.max(0, Math.min(1, p.t / 40, (p.life - p.t) / 40));
      cx.globalCompositeOperation = p.m === "embers" ? "lighter" : "source-over"; cx.fillStyle = p.c; cx.globalAlpha = p.a * fade;
      cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
    });
    cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over"; raf = requestAnimationFrame(tick);
  }
  resize(); addEventListener("resize", resize);
  return { set(next) { const s = JSON.stringify(next); if (s === sig) return; sig = s; cfg = next; parts = Array.from({ length: N }, (_, i) => make(i, true)); if (!raf && N) raf = requestAnimationFrame(tick); } };
})();

/* test hook for automated checks (no UI) */
window.EDEN_FORGE = { generate: forgeGenerate, render: forgeRender, code: recipeCode, decode: codeRecipe, normRecipe, version: FORGE_V };

  IMG.seed(DATA.meta && DATA.meta.pictures);
  forgeLoadState();
  routeHash();
