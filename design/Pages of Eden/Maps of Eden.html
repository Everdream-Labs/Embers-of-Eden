const PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
/* ---------- Pictures: Name.jpg, Name1.jpg, Name2.jpg … — click a picture to cycle the shortlist ---------- */
const IMG = (() => {
  const EXT = ["jpg", "png", "webp", "jpeg"];
  const EMB = window.EDEN_IMAGES || null;
  const KEY = "edenCodex.pictures";
  const cache = {};
  let pick = {};
  try { pick = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const stemOf = p => String(p || "").replace(/\.(jpe?g|png|webp)$/i, "");
  const src = p => (EMB && EMB[p]) || encodeURI(p).replace(/#/g, "%23");
  const probe = p => new Promise(res => {
    if (EMB) return res(!!EMB[p]);
    const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src(p);
  });
  async function at(stem, n) { for (const e of EXT) { const p = `${stem}${n || ""}.${e}`; if (await probe(p)) return p; } return null; }
  function list(stem) {
    if (!cache[stem]) cache[stem] = (async () => {
      const out = [], first = await at(stem, 0);
      if (first) out.push(first);
      for (let n = 1; n < 40; n++) { const p = await at(stem, n); if (!p) break; out.push(p); }
      return out;
    })();
    return cache[stem];
  }
  function badge(img, i, n) {
    const host = img.parentNode; if (!host) return;
    let b = host.querySelector(":scope > .pic-count");
    if (n < 2) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement("span"); b.className = "pic-count"; host.appendChild(b); }
    b.textContent = `${i + 1} / ${n} · click to cycle`;
  }
  async function hydrate(img) {
    if (img.dataset.ready) return;
    img.dataset.ready = "1";
    const stem = img.dataset.stem, paths = await list(stem);
    if (!paths.length) { img.remove(); return; }
    const i = (pick[stem] || 0) % paths.length;
    img.onload = () => { if (img.parentNode) img.parentNode.classList.add("has-img"); };
    img.src = src(paths[i]);
    if (img.hasAttribute("data-cycle")) badge(img, i, paths.length);
  }
  async function cycle(img) {
    const stem = img.dataset.stem, paths = await list(stem);
    const file = stem.split("/").pop();
    if (paths.length < 2) { toast(`Only one picture — add ${file}1.jpg, ${file}2.jpg… to shortlist more`); return; }
    const i = ((pick[stem] || 0) + 1) % paths.length;
    pick[stem] = i;
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {}
    document.querySelectorAll(`img[data-stem="${CSS.escape(stem)}"]`).forEach(x => { x.src = src(paths[i]); if (x.hasAttribute("data-cycle")) badge(x, i, paths.length); });
    SFX.play("shutter");
    toast(`Picture ${i + 1} of ${paths.length} — ${paths[i].split("/").pop()}`);
  }
  document.addEventListener("click", e => {
    const img = e.target.closest && e.target.closest("img[data-cycle]");
    if (!img) return;
    e.stopPropagation(); e.preventDefault();
    cycle(img);
  }, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.matches("img[data-stem]")) hydrate(n);
    n.querySelectorAll("img[data-stem]").forEach(hydrate);
  }))).observe(document.documentElement, { childList: true, subtree: true });
  return {
    tag: (path, cycleIt, alt) => `<img data-stem="${esc(stemOf(path))}"${cycleIt ? " data-cycle" : ""} alt="${esc(alt || "")}">`,
    hint: path => `add “${path}” — or ${stemOf(path).split("/").pop()}1, 2, 3… to shortlist`,
    snapshot: () => Object.assign({}, pick),
    seed: obj => { if (obj) Object.entries(obj).forEach(([k, v]) => { if (!(k in pick)) pick[k] = v; }); }
  };
})();

    return `<div class="slot-row ${off ? "off" : ""}">
      <span class="num">${i + 1}</span>
      ${i >= maxP ? `<span class="dim" style="font-size:.78rem">Map holds ${maxP}</span>` : sel(s.who, LOBBY.format === "duos" && i === 0 ? [["You", "You + partner"]] : whoList, `setSlot(${i},'who',this.value)`)}
      ${sel(s.w1, wOpts, `setSlot(${i},'w1',this.value)`)}
      ${solo ? `<span class="dim" style="font-size:.78rem;text-align:center">Commands alone</span>` : sel(s.w2, w2opts, `setSlot(${i},'w2',this.value)`)}
      ${sel(s.team, ["-", "1", "2", "3", "4"], `setSlot(${i},'team',this.value)`)}
      <span><span class="dot" style="background:${L.colourHex[s.colour]}"></span>${sel(s.colour, L.colours, `setSlot(${i},'colour',this.value)`)}</span></div>`;
  }).join("");
  const active = LOBBY.slots.filter((s, i) => i < maxP && s.who !== "Closed");
  const set = (label, key, list) => `<div class="set-row"><span>${label}</span>${sel(LOBBY[key], list, `setLobby('${key}',this.value)`)}</div>`;
  return `
    <div class="tree-head"><div class="kicker">Set up a match — Age of Empires II style</div><h2>Game Modes</h2><p>Pick a format and victory condition, choose a map, fill the slots with Warlord pairs, then read the match card. Prototype only — it doesn't launch the game yet.</p></div>
    <div class="lobby" style="margin-top:14px">
      <div>
        <div class="slots">
          <div class="slot-row head"><span>#</span><span>Player</span><span>Warlord I</span><span>Warlord II</span><span>Team</span><span>Colour</span></div>
          ${rows}
        </div>
        <div class="mode-desc"><b>${esc(fmt.name)}</b> — ${ed(`formats.${DATA.formats.indexOf(fmt)}.desc`, fmt.desc, true)}<ul>${fmt.rules.map((r, k) => `<li>${ed(`formats.${DATA.formats.indexOf(fmt)}.rules.${k}`, r)}</li>`).join("")}</ul></div>
        <div class="mode-desc"><b>${esc(vic.name)}</b> — ${ed(`victories.${DATA.victories.indexOf(vic)}.desc`, vic.desc, true)}<ul>${vic.rules.map((r, k) => `<li>${ed(`victories.${DATA.victories.indexOf(vic)}.rules.${k}`, r)}</li>`).join("")}</ul></div>
      </div>
      <div class="settings">
        ${set("Format", "format", DATA.formats.map(f => [f.id, f.name]))}
        ${set("Victory", "victory", DATA.victories.map(v => [v.id, v.name]))}
        ${set("Map", "map", DATA.maps.map(x => [x.id, x.name]))}
        ${set("Map size", "size", L.size)}
        ${set("Resources", "resources", L.resources)}
        ${set("Starting age", "age", L.age)}
        ${set("Game speed", "speed", L.speed)}
        ${set("Population cap", "pop", L.pop)}
        ${set("Treaty", "treaty", L.treaty)}
        ${set("Visibility", "fog", L.fog)}
        ${set("AI difficulty", "ai", L.ai)}
        ${set("Warlord mixing", "mixing", L.mixing)}
        <div class="center-row" style="margin-top:10px"><button class="btn" onclick="openViewer('${m.id}')">&#128506; Preview map</button><button class="mini" onclick="LOBBY=defaultLobby();saveLobby();renderAll()">Reset</button></div>
      </div>
    </div>
    <div class="match-card">
      <h4>Match card</h4>
      <p style="margin:0 0 6px">${esc(fmt.name)} · ${esc(vic.name)} on <b style="color:${DUO[m.duo].color}">${esc(m.name)}</b> (${esc(BIOME(m.biome).name)}) · ${active.length} colonies · ${esc(LOBBY.resources)} resources · ${esc(LOBBY.age)} age · pop ${esc(LOBBY.pop)} · ${esc(LOBBY.speed)} · treaty ${esc(LOBBY.treaty)} · ${esc(LOBBY.fog)}</p>
      <div class="center-row">${active.map((s, i) => { const a1 = WARLORD[s.w1], a2 = WARLORD[s.w2]; const home = DUO[a1.duo].id === m.duo || (a2 && DUO[a2.duo].id === m.duo); return `<span class="chip" style="border-color:${L.colourHex[s.colour]}"><span class="dot" style="background:${L.colourHex[s.colour]}"></span>${esc(s.who)}: <b style="color:${a1.accent}">${esc(a1.name)}</b>${a2 && a2.id !== a1.id ? ` + <b style="color:${a2.accent}">${esc(a2.name)}</b>` : ""}${home ? " ★ home turf" : ""}</span>`; }).join("")}</div>
      <div class="center-row" style="margin-top:10px"><button class="btn" onclick="copyMatch()">Copy setup</button><button class="btn" onclick="toast('Not wired to the game yet — setup saved as your preset')">&#9654; Start (prototype)</button></div>
    </div>`;
}
function copyMatch() {
  const m = MAP(LOBBY.map), txt = `Embers of Eden — ${DATA.formats.find(f => f.id === LOBBY.format).name} / ${DATA.victories.find(v => v.id === LOBBY.victory).name} on ${m.name}\n` +
    LOBBY.slots.filter(s => s.who !== "Closed").map((s, i) => `${i + 1}. ${s.who} — ${WARLORD[s.w1].name}${s.w2 !== s.w1 ? " + " + WARLORD[s.w2].name : ""} (team ${s.team}, ${s.colour})`).join("\n") +
    `\nResources ${LOBBY.resources} · Age ${LOBBY.age} · Pop ${LOBBY.pop} · Speed ${LOBBY.speed} · Treaty ${LOBBY.treaty} · ${LOBBY.fog}`;
  navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast("Setup copied — paste it to Axel"), () => toast("Copy failed"));
}

/* ---------- Extras — map info page ---------- */
function renderExtras() {
  const biomeCards = DATA.biomes.map((b, i) => {
    const maps = DATA.maps.filter(m => m.biome === b.id || m.alt === b.id);
    return `<div class="vcard" style="--tab:${DUO[b.duo].color}"><div class="bio-strip">${b.pal.map(c => `<i style="background:${c}"></i>`).join("")}</div>
      <h3>${ed(`biomes.${i}.name`, b.name)}</h3><p>${ed(`biomes.${i}.desc`, b.desc, true)}</p>
      <ul>${b.rules.map((r, k) => `<li>${ed(`biomes.${i}.rules.${k}`, r)}</li>`).join("")}</ul>
      <p style="margin-top:8px"><small class="dim">Home:</small> ${duoChip(b.duo)} ${b.hostile.length ? `<small class="dim">Hostile for:</small> ${b.hostile.map(duoChip).join(" ")}` : ""}</p>
      <p style="margin:0"><small class="dim">Maps:</small> ${maps.map(m => `<button class="xlink" onclick="state.map='${m.id}';go('maps')">${esc(m.name)}</button>`).join(" ")}</p></div>`;
  }).join("");
  const matrix = `<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Duo</th>${DATA.biomes.map(b => `<th>${esc(b.name)}</th>`).join("")}</tr></thead><tbody>
    ${EDEN_DUOS.map(d => `<tr><td class="duo" style="color:${d.color}">${sigil(d.id)}${esc(d.name)}</td>${DATA.biomes.map(b => b.duo === d.id ? `<td class="home">Home</td>` : b.hostile.includes(d.id) ? `<td class="hostile">Hostile</td>` : "<td></td>").join("")}</tr>`).join("")}
    </tbody></table></div>`;
  const terr = EDEN_DUOS.map(d => `<div class="vcard" style="--tab:${d.color}"><h3>${sigil(d.id)} ${esc(d.name)}</h3>
    <p><b style="color:var(--good)">Home</b> — ${ed(`terrain.${d.id}.home`, DATA.terrain[d.id].home)}</p>
    <p><b style="color:var(--bad)">Hostile</b> — ${ed(`terrain.${d.id}.hostile`, DATA.terrain[d.id].hostile)}</p>
    <ul>${d.warlords.map(([id, n, acc]) => `<li><b style="color:${acc}">${esc(n)} · ${ed(`warlordTerrain.${id}.0`, DATA.warlordTerrain[id][0])}</b> — ${ed(`warlordTerrain.${id}.1`, DATA.warlordTerrain[id][1])}</li>`).join("")}</ul></div>`).join("");
  return `
    <div class="tree-head"><div class="kicker">Map info · temperaments · neutrals · relics</div><h2>Extras</h2><p>Each map has a temperament — a primary and a secondary terrain type. Every Duo has one home terrain and at most one hostile one; every Warlord adds one subtle terrain trait. Nothing decides a match on its own — it rewards reading the land.</p></div>
    <div class="sec" style="margin-top:14px"><div class="sec-title">Terrain types</div><div class="vgrid">${biomeCards}</div></div>
    <div class="sec"><div class="sec-title">Home-turf table</div>${matrix}</div>
    <div class="sec"><div class="sec-title">Duo &amp; Warlord terrain traits</div><div class="vgrid">${terr}</div>
      <p class="foot" style="text-align:center">Warlord traits also appear on each Warlord in Warlords of Eden. Values are subtle by design (±5–15%) and all placeholders until balanced.</p></div>
    <div class="sec"><div class="sec-title">Neutral settlements &amp; NPC towns</div><div class="vgrid">${DATA.settlements.map((s, i) => `<div class="vcard"><h3>${ed(`settlements.${i}.name`, s.name)}</h3><p><small class="dim">${ed(`settlements.${i}.size`, s.size)}</small></p><p>${ed(`settlements.${i}.desc`, s.desc, true)}</p><p><b>Options:</b> ${ed(`settlements.${i}.options`, s.options)}</p></div>`).join("")}</div>
      <div class="vcard" style="margin-top:12px"><h3>How Duos treat neutrals</h3><ul>${DATA.reactions.map((r, i) => `<li>${ed(`reactions.${i}`, r)}</li>`).join("")}</ul></div>
      <p class="foot" style="text-align:center">Neutrals never expand. Options and reactions depend on your Warlords (Visions).</p></div>
    <div class="sec"><div class="sec-title">Relics</div><div class="vgrid">${DATA.relics.map((r, i) => `<div class="vcard" style="--tab:#ffe08a"><h3>${ed(`relics.${i}.name`, r.name)}</h3><p>${ed(`relics.${i}.effect`, r.effect, true)}</p></div>`).join("")}</div>
      <p class="foot" style="text-align:center">Relics are freshly placed each game; mechanics are still open — these are suggestions.</p></div>
    <div class="sec"><div class="sec-title">Wildlife by terrain</div><div class="vcard"><ul>${DATA.wildlife.map((w, i) => `<li>${ed(`wildlife.${i}`, w)}</li>`).join("")}</ul></div></div>`;
}

/* ---------- modal, edit mode, toast ---------- */
function openModal(html, wide) {
  if (!quiet) SFX.play("modalOpen");
  $("#modal-box").classList.toggle("wide", !!wide);
  const b = $("#modal-body"), keep = quiet ? b.scrollTop : 0;
  b.innerHTML = html; b.scrollTop = keep;
  $("#modal").classList.add("open"); applyEditable();
}
function closeModal() { const o = $("#modal").classList.contains("open"); $("#modal").classList.remove("open"); reopen = null; if (o) { SFX.play("modalClose"); if (state.editing) renderAll(); } }
const PLAIN = (() => { const d = document.createElement("div"); try { d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only"; } catch (e) { return false; } })();
function applyEditable() { $$("[data-edit]").forEach(el => { if (state.editing) { el.setAttribute("contenteditable", PLAIN ? "plaintext-only" : "true"); el.spellcheck = true; } else el.removeAttribute("contenteditable"); }); }
function toggleEdit() {
  state.editing = !state.editing;
  document.body.classList.toggle("editing", state.editing);
  $("#btn-edit").classList.toggle("active", state.editing);
  SFX.play("tab", { pitch: state.editing ? 1.15 : 0.88 });
  refresh(); toast(state.editing ? "Edit mode on" : "Edit mode off");
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1900); }
document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (!el || !state.editing) return;
  const v = el.innerText.replace(/\u00a0/g, " ").trim();
  if (getPath(DATA, el.dataset.edit) === v) return;
  setPath(DATA, el.dataset.edit, v); persist("Saved");
});
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (el && el.isContentEditable) { if (e.key === "Enter" && !el.hasAttribute("data-ml")) { e.preventDefault(); el.blur(); } if (e.key === "Escape") el.blur(); return; }
  if (e.key === "Escape") return closeModal();
  if ($("#modal").classList.contains("open") || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= DATA.tabs.length) go(DATA.tabs[n - 1].id);
});

/* ---------- UI sounds — procedural Web Audio with a warm room tone; one mute shared across books ---------- */
const SFX = (() => {
  let ctx = null, out = null, muted = false;
  try { muted = (localStorage.getItem("edenCodex.mute") ?? localStorage.getItem("warlordsOfEden.mute")) === "1"; } catch (e) {}
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ensure() {
    if (reduce) return Promise.resolve();
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25;
      out = ctx.createGain(); out.gain.value = 0.5;
      const send = ctx.createGain(), dl = ctx.createDelay(0.5), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
      send.gain.value = 0.22; dl.delayTime.value = 0.09; fb.gain.value = 0.35; lp.type = "lowpass"; lp.frequency.value = 2200;
      out.connect(comp); out.connect(send); send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(comp);
      comp.connect(ctx.destination);
    }
    return ctx.state === "suspended" ? ctx.resume() : Promise.resolve();
  }
  document.addEventListener("pointerdown", () => { ensure(); }, { once: true, passive: true });
  function env(g, t, peak, atk, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(f, t, dur, peak, type, f2) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.connect(g); g.connect(out); env(g, t, peak, Math.min(0.01, dur / 4), dur); o.start(t); o.stop(t + dur + 0.05);
  }
  function pluck(f, t, dur, peak) { tone(f, t, dur, peak, "triangle"); tone(f * 2.003, t, dur * 0.6, peak * 0.25, "sine"); }
  function hiss(t, dur, peak, type, f1, f2, q) {
    const n = Math.ceil(ctx.sampleRate * (dur + 0.05)), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; fl.type = type; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    fl.Q.value = q || 1;
    s.connect(fl); fl.connect(g); g.connect(out); env(g, t, peak, Math.min(0.02, dur / 3), dur); s.start(t); s.stop(t + dur + 0.05);
  }
  const KIT = {
    tab: (t, p) => { hiss(t, 0.035, 0.16, "bandpass", 2400 * p, 0, 5); pluck(587 * p, t + 0.005, 0.12, 0.07); },
    back: t => { pluck(659, t, 0.12, 0.06); pluck(494, t + 0.07, 0.16, 0.06); hiss(t, 0.12, 0.05, "bandpass", 1200, 500, 2); },
    modalOpen: t => { hiss(t, 0.22, 0.07, "bandpass", 380, 1700, 1.4); tone(92, t, 0.24, 0.16, "sine", 52); pluck(880, t + 0.06, 0.4, 0.03); },
    picker: t => { hiss(t, 0.2, 0.06, "bandpass", 500, 1900, 1.4); tone(110, t, 0.2, 0.12, "sine", 62); pluck(740, t + 0.05, 0.3, 0.035); pluck(988, t + 0.11, 0.3, 0.025); },
    modalClose: t => { hiss(t, 0.14, 0.055, "bandpass", 1500, 420, 1.6); tone(330, t, 0.12, 0.045, "sine", 220); },
    select: (t, p) => { pluck(523 * p, t, 0.22, 0.08); pluck(784 * p, t + 0.065, 0.3, 0.065); },
    duoLoad: t => { tone(55, t, 0.7, 0.16, "sine"); tone(82.4, t + 0.02, 0.6, 0.08, "sine"); hiss(t, 0.5, 0.07, "lowpass", 180, 900, 0.7); [330, 415, 494, 659].forEach((f, i) => pluck(f, t + 0.12 + i * 0.07, 0.5, 0.04)); },
    node: (t, p) => { hiss(t, 0.025, 0.08, "highpass", 3200, 0, 0.8); pluck(740 * p, t, 0.14, 0.055); },
    toggle: (t, p, on) => { if (on) { pluck(523, t, 0.15, 0.06); pluck(784, t + 0.07, 0.2, 0.06); } else { pluck(784, t, 0.15, 0.05); pluck(523, t + 0.07, 0.2, 0.05); } },
    save: t => [523, 659, 784, 1047].forEach((f, i) => pluck(f, t + i * 0.08, 0.45, 0.055)),
    shutter: t => { hiss(t, 0.018, 0.14, "bandpass", 3000, 0, 3); hiss(t + 0.06, 0.022, 0.1, "bandpass", 2200, 0, 3); pluck(1175, t + 0.06, 0.08, 0.025); }
  };
  function play(kind, opts) {
    if (muted || reduce || (typeof quiet !== "undefined" && quiet)) return;
    const fn = KIT[kind];
    if (!fn) return;
    ensure().then(() => { if (ctx) fn(ctx.currentTime + 0.005, (opts && opts.pitch) || 1, !muted); }).catch(() => {});
  }
  function sync() {
    const b = document.getElementById("btn-sound");
    if (!b) return;
    b.textContent = muted ? "\u{1F507} Muted" : "\u{266A} Sound";
    b.classList.toggle("active", !muted);
    b.title = muted ? "UI sounds off — click to enable" : "UI sounds on — click to mute";
  }
  function toggleMute() { muted = !muted; try { localStorage.setItem("edenCodex.mute", muted ? "1" : "0"); } catch (e) {} sync(); if (!muted) play("toggle"); }
  return { play, toggleMute, sync };
})();

/* ---------- atmosphere particles ---------- */
const FX = (() => {
  const cv = $("#fx"), cx = cv.getContext("2d");
  const N = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0 : 100;
  let w = 0, h = 0, parts = [], cfg = [], sig = "", raf = 0;
  const R = (a, b) => a + Math.random() * (b - a);
  function resize() { const d = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight; cv.width = w * d; cv.height = h * d; cv.style.width = w + "px"; cv.style.height = h + "px"; cx.setTransform(d, 0, 0, d, 0, 0); }
  function make(i, init) {
    const c = cfg[i % cfg.length], p = { m: c.mode, c: c.color, t: 0, life: R(320, 900), a: R(.3, .85), s: R(1, 2.6), ph: R(0, 6.28), vx: 0, vy: 0 };
    if (p.m === "embers") { p.x = R(0, w); p.y = init ? R(0, h) : h + R(0, 40); p.vx = R(-.2, .2); p.vy = -R(.35, 1.3); }
    else if (p.m === "dust") { p.x = init ? R(0, w) : -R(0, 60); p.y = R(0, h); p.vx = R(.8, 2.6); p.vy = R(-.15, .15); p.a = R(.1, .35); }
    else { p.x = R(0, w); p.y = init ? R(0, h) : -R(0, 40); p.vx = R(-.25, .35); p.vy = R(.25, .7); p.a = R(.15, .45); if (p.m === "ash" && Math.random() < .7) p.c = "#bdb5a6"; }
    return p;
  }
  function tick() {
    cx.clearRect(0, 0, w, h);
    parts.forEach((p, i) => {
      p.t++; p.x += p.vx + Math.sin(p.t / 45 + p.ph) * .3; p.y += p.vy;
      if (p.y < -90 || p.y > h + 90 || p.x < -90 || p.x > w + 90 || p.t > p.life) { parts[i] = make(i, false); return; }
      const fade = Math.max(0, Math.min(1, p.t / 40, (p.life - p.t) / 40));
      cx.globalCompositeOperation = p.m === "embers" ? "lighter" : "source-over"; cx.fillStyle = p.c; cx.globalAlpha = p.a * fade;
      cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
    });
    cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over"; raf = requestAnimationFrame(tick);
  }
  resize(); addEventListener("resize", resize);
  return { set(next) { const s = JSON.stringify(next); if (s === sig) return; sig = s; cfg = next; parts = Array.from({ length: N }, (_, i) => make(i, true)); if (!raf && N) raf = requestAnimationFrame(tick); } };
})();

(function init() {
  const note = boot();
  IMG.seed(DATA.meta && DATA.meta.pictures);
  const parts = decodeURIComponent(location.hash.slice(1)).split("/");
  if (DATA.tabs.some(t => t.id === parts[0])) state.tab = parts[0];
  if (MAP(parts[1])) state.map = parts[1];
  SFX.sync(); renderAll();
  if (parts[2] === "view") openViewer(state.map);
  if (note) toast(note);
})();
</script>
