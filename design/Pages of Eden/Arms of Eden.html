/* ---------- Pictures: Name.jpg, Name1.jpg, Name2.jpg … — click a picture to cycle the shortlist ---------- */
const IMG = (() => {
  const EXT = ["jpg", "png", "webp", "jpeg"];
  const EMB = window.EDEN_IMAGES || null;
  const KEY = "edenCodex.pictures";
  const cache = {};
  let pick = {};
  try { pick = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const stemOf = p => String(p || "").replace(/\.(jpe?g|png|webp)$/i, "");
  const src = p => (EMB && EMB[p]) || encodeURI(p).replace(/#/g, "%23");
  const probe = p => new Promise(res => {
    if (EMB) return res(!!EMB[p]);
    const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src(p);
  });
  async function at(stem, n) { for (const e of EXT) { const p = `${stem}${n || ""}.${e}`; if (await probe(p)) return p; } return null; }
  function list(stem) {
    if (!cache[stem]) cache[stem] = (async () => {
      const out = [], first = await at(stem, 0);
      if (first) out.push(first);
      for (let n = 1; n < 40; n++) { const p = await at(stem, n); if (!p) break; out.push(p); }
      return out;
    })();
    return cache[stem];
  }
  function badge(img, i, n) {
    const host = img.parentNode; if (!host) return;
    let b = host.querySelector(":scope > .pic-count");
    if (n < 2) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement("span"); b.className = "pic-count"; host.appendChild(b); }
    b.textContent = `${i + 1} / ${n} · click to cycle`;
  }
  async function hydrate(img) {
    if (img.dataset.ready) return;
    img.dataset.ready = "1";
    const stem = img.dataset.stem, paths = await list(stem);
    if (!paths.length) { img.remove(); return; }
    const i = (pick[stem] || 0) % paths.length;
    img.onload = () => { if (img.parentNode) img.parentNode.classList.add("has-img"); };
    img.src = src(paths[i]);
    if (img.hasAttribute("data-cycle")) badge(img, i, paths.length);
  }
  async function cycle(img) {
    const stem = img.dataset.stem, paths = await list(stem);
    const file = stem.split("/").pop();
    if (paths.length < 2) { toast(`Only one picture — add ${file}1.jpg, ${file}2.jpg… to shortlist more`); return; }
    const i = ((pick[stem] || 0) + 1) % paths.length;
    pick[stem] = i;
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {}
    document.querySelectorAll(`img[data-stem="${CSS.escape(stem)}"]`).forEach(x => { x.src = src(paths[i]); if (x.hasAttribute("data-cycle")) badge(x, i, paths.length); });
    SFX.play("shutter");
    toast(`Picture ${i + 1} of ${paths.length} — ${paths[i].split("/").pop()}`);
  }
  document.addEventListener("click", e => {
    const img = e.target.closest && e.target.closest("img[data-cycle]");
    if (!img) return;
    e.stopPropagation(); e.preventDefault();
    cycle(img);
  }, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.matches("img[data-stem]")) hydrate(n);
    n.querySelectorAll("img[data-stem]").forEach(hydrate);
  }))).observe(document.documentElement, { childList: true, subtree: true });
  return {
    tag: (path, cycleIt, alt) => `<img data-stem="${esc(stemOf(path))}"${cycleIt ? " data-cycle" : ""} alt="${esc(alt || "")}">`,
    hint: path => `add “${path}” — or ${stemOf(path).split("/").pop()}1, 2, 3… to shortlist`,
    snapshot: () => Object.assign({}, pick),
    seed: obj => { if (obj) Object.entries(obj).forEach(([k, v]) => { if (!(k in pick)) pick[k] = v; }); }
  };
})();

const union = list => list.reduce((b, v) => (b == null || (ACC.rank[v] ?? 1) > (ACC.rank[b] ?? 1) ? v : b), null) || "tbd";

const pairHash = () => (PAIR.w1 ? `${PAIR.w1}+${PAIR.w2}` : "all");
const pairAccents = () => (!PAIR.w1 ? [] : [...new Set([PAIR.w1, PAIR.w2])].map(id => WARLORD[id]));

}

  else if (DUO[WARLORD[id].duo].single) PAIR.w1 = PAIR.w2 = id;
  else if (slot === 1) { PAIR.w1 = id; if (!PAIR.w2 || prev !== "mixed" || PAIR.w2 === id || DUO[WARLORD[PAIR.w2].duo].single) PAIR.w2 = partner(id); }
  else { if (!PAIR.w1 || DUO[WARLORD[PAIR.w1].duo].single) PAIR.w1 = partner(id); PAIR.w2 = id; if (PAIR.w1 === PAIR.w2) PAIR.w1 = partner(id); }

const STORE_KEY = "armsOfEden.v1";
const state = { tab: "troops", editing: false };
let DATA = null, fileRev = "factory", reopen = null, quiet = false;
function readBaked() { try { const t = $("#codex-baked").textContent.trim(); return t && t !== "null" ? JSON.parse(t) : null; } catch (e) { return null; } }
function boot() {
  const file = readBaked() || clone(DEFAULT_DATA);
  fileRev = (file.meta && file.meta.dataRev) || "factory";
  DATA = file;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s.basedOn === fileRev && s.data) { DATA = s.data; return "Loaded your browser edits"; }
      localStorage.setItem(STORE_KEY + ".archived", raw); localStorage.removeItem(STORE_KEY);
      return "This file was updated — older browser edits archived";

}
function persist(msg) { try { localStorage.setItem(STORE_KEY, JSON.stringify({ basedOn: fileRev, data: DATA })); } catch (e) {} if (msg) toast(msg); }
async function saveHtml() {
  const re = /(<script type="application\/json" id="codex-baked">)[\s\S]*?(<\/script>)/;
  const now = new Date();
  DATA.meta.dataRev = "save-" + now.toISOString(); DATA.meta.updated = now.toISOString().slice(0, 10); DATA.meta.pictures = IMG.snapshot();
  const html = PRISTINE_HTML.replace(re, (m, a, b) => a + JSON.stringify(DATA).replace(/</g, "\\u003c") + b);
  let done = false;
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName: "Arms of Eden.html", types: [{ description: "HTML page", accept: { "text/html": [".html"] } }] });
      const w = await h.createWritable(); await w.write(html); await w.close(); done = true;
    } catch (e) { if (e && e.name === "AbortError") return; }
  }
  if (!done) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = "Arms of Eden.html"; a.click(); }
  fileRev = DATA.meta.dataRev; persist(); SFX.play("save");

}
function exportData() { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" })); a.download = "arms-of-eden-data.json"; a.click(); toast("Exported arms-of-eden-data.json"); }

/* ---------- WEAPONS + ARMOUR TREES ---------- */
const GEO = { head: 44, colW: 168, rowH: 140, nodeW: 142, nodeH: 100 };
function treeSpec(kind) {
  return kind === "weapons"
    ? { items: DATA.weapons, lanes: DATA.weaponLanes, bands: DATA.weaponBands, acc: weaponAccess, open: "openWeapon", sub: w => `${DATA.classes[w.cls]} · ${w.material}`, intro: "Material tiers run top to bottom (Stone → Bronze → Iron → Steel → Hardened Steel); energy weapons arrive at the steel tier. Lines show upgrade lineage." }

}
function renderTree(kind) {
  const S = treeSpec(kind);
  const W = S.lanes.length * GEO.colW + 16, H = GEO.head + S.bands.length * GEO.rowH + 8, pos = {};
  S.items.forEach(n => { pos[n.id] = { x: 8 + n.col * GEO.colW + (GEO.colW - GEO.nodeW) / 2, y: GEO.head + n.row * GEO.rowH + (GEO.rowH - GEO.nodeH) / 2 }; });
  const color = n => S.lanes[n.col].color;
  let links = "";
  S.items.forEach(n => (n.from || []).forEach(f => {
    const a = pos[f], b = pos[n.id]; if (!a || !b) return;
    const x1 = a.x + GEO.nodeW / 2, y1 = a.y + GEO.nodeH, x2 = b.x + GEO.nodeW / 2, y2 = b.y, dy = Math.max(26, (y2 - y1) * 0.5);
    links += `<path data-a="${f}" data-b="${n.id}" class="${verdictBy(d => S.acc(n, d)) === "no" ? "gated" : ""}" stroke="${color(n)}" d="M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}"/>`;
  }));
  const card = n => {
    const v = verdictBy(d => S.acc(n, d));
    const cls = [n.locked ? "" : "placeholder", v === "no" ? "gated" : ""].join(" ");
    const badge = v && v !== "yes" ? `<span class="acc" style="color:${ACC.color[v]}">${ACC.mark[v]} ${ACC.label[v]}</span>` : "";
    const st = (n.status || n.resist || []).map(id => { const s = STATUS(id); return s ? `<b style="color:${s.color}">${esc(s.code)}</b>` : ""; }).join(" ");
    return `<div class="node ${cls}" data-key="${n.id}" style="--acc:${color(n)}" onclick="${S.open}('${n.id}')">${badge}<div class="code">${esc(n.code)}</div><div class="n-name">${esc(n.name)}</div><div class="n-sub">${esc(S.sub(n))}</div>${st ? `<span class="ext">${st}</span>` : ""}</div>`;
  };
  return `<div class="tree-head"><div class="kicker">${kind === "weapons" ? "Crafted at Blacksmith · Bowyer · Gunsmith · Lab" : "Crafted at the Armourer"}</div><h2>${kind === "weapons" ? "Weapons" : "Armour"}</h2><p>${S.intro}</p></div>

function wireTree(kind) {
  const root = $("#tree"); if (!root) return;
  const items = kind === "weapons" ? DATA.weapons : DATA.armour, up = {}, down = {};
  items.forEach(n => (n.from || []).forEach(f => { (up[n.id] = up[n.id] || []).push(f); (down[f] = down[f] || []).push(n.id); }));
  const walk = (k, map, set) => (map[k] || []).forEach(x => { if (!set.has(x)) { set.add(x); walk(x, map, set); } });
  root.querySelectorAll(".node[data-key]").forEach(el => {
    el.addEventListener("mouseenter", () => {
      const set = new Set([el.dataset.key]); walk(el.dataset.key, up, set); walk(el.dataset.key, down, set);
      root.classList.add("tracing");
      root.querySelectorAll(".node[data-key]").forEach(x => x.classList.toggle("lit", set.has(x.dataset.key)));
      root.querySelectorAll("path[data-a]").forEach(p => p.classList.toggle("lit", set.has(p.dataset.a) && set.has(p.dataset.b)));
    });
    el.addEventListener("mouseleave", () => { root.classList.remove("tracing"); root.querySelectorAll(".lit").forEach(x => x.classList.remove("lit")); });
  });
  const sc = root.querySelector(".tc-scroll");
  let drag = null;
  sc.addEventListener("pointerdown", e => { if (e.target.closest(".node")) return; drag = { x: e.clientX, l: sc.scrollLeft }; sc.classList.add("grab"); });
  sc.addEventListener("pointermove", e => { if (drag) sc.scrollLeft = drag.l - (e.clientX - drag.x); });
  ["pointerup", "pointerleave"].forEach(ev => sc.addEventListener(ev, () => { drag = null; sc.classList.remove("grab"); }));
}

function toggleLock(obj) { obj.locked = !obj.locked; persist(obj.locked ? "Marked locked" : "Marked placeholder"); refresh(); }

/* ---------- modal, edit mode, toast ---------- */
function openModal(html) {
  if (!quiet) SFX.play("modalOpen");
  const b = $("#modal-body"), keep = quiet ? b.scrollTop : 0;
  b.innerHTML = html; b.scrollTop = keep;
  $("#modal").classList.add("open"); applyEditable();
}
function closeModal() { const o = $("#modal").classList.contains("open"); $("#modal").classList.remove("open"); reopen = null; if (o) { SFX.play("modalClose"); if (state.editing) renderAll(); } }
const PLAIN = (() => { const d = document.createElement("div"); try { d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only"; } catch (e) { return false; } })();
function applyEditable() { $$("[data-edit]").forEach(el => { if (state.editing) { el.setAttribute("contenteditable", PLAIN ? "plaintext-only" : "true"); el.spellcheck = true; } else el.removeAttribute("contenteditable"); }); }
function toggleEdit() {
  state.editing = !state.editing;
  document.body.classList.toggle("editing", state.editing);
  $("#btn-edit").classList.toggle("active", state.editing);
  SFX.play("tab", { pitch: state.editing ? 1.15 : 0.88 });
  refresh(); toast(state.editing ? "Edit mode on" : "Edit mode off");
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1900); }
document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (!el || !state.editing) return;
  const v = el.innerText.replace(/\u00a0/g, " ").trim();
  if (getPath(DATA, el.dataset.edit) === v) return;
  setPath(DATA, el.dataset.edit, v); persist("Saved");
});
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (el && el.isContentEditable) { if (e.key === "Enter" && !el.hasAttribute("data-ml")) { e.preventDefault(); el.blur(); } if (e.key === "Escape") el.blur(); return; }
  if (e.key === "Escape") return closeModal();
  if ($("#modal").classList.contains("open") || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= DATA.tabs.length) go(DATA.tabs[n - 1].id);
});

/* ---------- UI sounds — procedural Web Audio with a warm room tone; one mute shared across books ---------- */
const SFX = (() => {
  let ctx = null, out = null, muted = false;
  try { muted = (localStorage.getItem("edenCodex.mute") ?? localStorage.getItem("warlordsOfEden.mute")) === "1"; } catch (e) {}
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ensure() {
    if (reduce) return Promise.resolve();
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25;
      out = ctx.createGain(); out.gain.value = 0.5;
      const send = ctx.createGain(), dl = ctx.createDelay(0.5), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
      send.gain.value = 0.22; dl.delayTime.value = 0.09; fb.gain.value = 0.35; lp.type = "lowpass"; lp.frequency.value = 2200;
      out.connect(comp); out.connect(send); send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(comp);
      comp.connect(ctx.destination);
    }
    return ctx.state === "suspended" ? ctx.resume() : Promise.resolve();
  }
  document.addEventListener("pointerdown", () => { ensure(); }, { once: true, passive: true });
  function env(g, t, peak, atk, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(f, t, dur, peak, type, f2) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.connect(g); g.connect(out); env(g, t, peak, Math.min(0.01, dur / 4), dur); o.start(t); o.stop(t + dur + 0.05);
  }
  function pluck(f, t, dur, peak) { tone(f, t, dur, peak, "triangle"); tone(f * 2.003, t, dur * 0.6, peak * 0.25, "sine"); }
  function hiss(t, dur, peak, type, f1, f2, q) {
    const n = Math.ceil(ctx.sampleRate * (dur + 0.05)), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; fl.type = type; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    fl.Q.value = q || 1;
    s.connect(fl); fl.connect(g); g.connect(out); env(g, t, peak, Math.min(0.02, dur / 3), dur); s.start(t); s.stop(t + dur + 0.05);
  }
  const KIT = {
    tab: (t, p) => { hiss(t, 0.035, 0.16, "bandpass", 2400 * p, 0, 5); pluck(587 * p, t + 0.005, 0.12, 0.07); },
    back: t => { pluck(659, t, 0.12, 0.06); pluck(494, t + 0.07, 0.16, 0.06); hiss(t, 0.12, 0.05, "bandpass", 1200, 500, 2); },
    modalOpen: t => { hiss(t, 0.22, 0.07, "bandpass", 380, 1700, 1.4); tone(92, t, 0.24, 0.16, "sine", 52); pluck(880, t + 0.06, 0.4, 0.03); },
    picker: t => { hiss(t, 0.2, 0.06, "bandpass", 500, 1900, 1.4); tone(110, t, 0.2, 0.12, "sine", 62); pluck(740, t + 0.05, 0.3, 0.035); pluck(988, t + 0.11, 0.3, 0.025); },
    modalClose: t => { hiss(t, 0.14, 0.055, "bandpass", 1500, 420, 1.6); tone(330, t, 0.12, 0.045, "sine", 220); },
    select: (t, p) => { pluck(523 * p, t, 0.22, 0.08); pluck(784 * p, t + 0.065, 0.3, 0.065); },
    duoLoad: t => { tone(55, t, 0.7, 0.16, "sine"); tone(82.4, t + 0.02, 0.6, 0.08, "sine"); hiss(t, 0.5, 0.07, "lowpass", 180, 900, 0.7); [330, 415, 494, 659].forEach((f, i) => pluck(f, t + 0.12 + i * 0.07, 0.5, 0.04)); },
    node: (t, p) => { hiss(t, 0.025, 0.08, "highpass", 3200, 0, 0.8); pluck(740 * p, t, 0.14, 0.055); },
    toggle: (t, p, on) => { if (on) { pluck(523, t, 0.15, 0.06); pluck(784, t + 0.07, 0.2, 0.06); } else { pluck(784, t, 0.15, 0.05); pluck(523, t + 0.07, 0.2, 0.05); } },
    save: t => [523, 659, 784, 1047].forEach((f, i) => pluck(f, t + i * 0.08, 0.45, 0.055)),
    shutter: t => { hiss(t, 0.018, 0.14, "bandpass", 3000, 0, 3); hiss(t + 0.06, 0.022, 0.1, "bandpass", 2200, 0, 3); pluck(1175, t + 0.06, 0.08, 0.025); }
  };
  function play(kind, opts) {
    if (muted || reduce || (typeof quiet !== "undefined" && quiet)) return;
    const fn = KIT[kind];
    if (!fn) return;
    ensure().then(() => { if (ctx) fn(ctx.currentTime + 0.005, (opts && opts.pitch) || 1, !muted); }).catch(() => {});
  }
  function sync() {
    const b = document.getElementById("btn-sound");
    if (!b) return;
    b.textContent = muted ? "\u{1F507} Muted" : "\u{266A} Sound";
    b.classList.toggle("active", !muted);
    b.title = muted ? "UI sounds off — click to enable" : "UI sounds on — click to mute";
  }
  function toggleMute() { muted = !muted; try { localStorage.setItem("edenCodex.mute", muted ? "1" : "0"); } catch (e) {} sync(); if (!muted) play("toggle"); }
  return { play, toggleMute, sync };
})();

/* ---------- atmosphere particles ---------- */
const FX = (() => {
  const cv = $("#fx"), cx = cv.getContext("2d");
  const N = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0 : 110;
  let w = 0, h = 0, parts = [], cfg = [], sig = "", raf = 0;
  const R = (a, b) => a + Math.random() * (b - a);
  function resize() { const d = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight; cv.width = w * d; cv.height = h * d; cv.style.width = w + "px"; cv.style.height = h + "px"; cx.setTransform(d, 0, 0, d, 0, 0); }
  function make(i, init) {
    const c = cfg[i % cfg.length], p = { m: c.mode, c: c.color, t: 0, life: R(320, 900), a: R(.3, .85), s: R(1, 2.6), ph: R(0, 6.28), vx: 0, vy: 0, wait: 0 };
    switch (p.m) {
      case "embers": p.x = R(0, w); p.y = init ? R(0, h) : h + R(0, 40); p.vx = R(-.2, .2); p.vy = -R(.35, 1.3); break;
      case "spores": p.x = R(0, w); p.y = R(0, h); p.vx = R(-.15, .15); p.vy = R(-.18, .08); p.s = R(1.5, 4.5); p.a = R(.08, .32); break;
      case "sparks": { p.x = R(0, w); p.y = R(0, h); const an = R(0, 6.28), sp = R(1.5, 4.5); p.vx = Math.cos(an) * sp; p.vy = Math.sin(an) * sp; p.life = R(16, 46); p.s = R(.8, 1.7); p.wait = R(0, 300); break; }
      case "dust": p.x = init ? R(0, w) : -R(0, 60); p.y = R(0, h); p.vx = R(.8, 2.6); p.vy = R(-.15, .15); p.a = R(.1, .35); p.s = R(.8, 2); break;
      case "drip": p.x = R(0, w); p.y = init ? R(0, h) : -R(0, 80); p.vy = R(.6, 1.6); p.s = R(1, 2); p.a = R(.25, .6); break;
      case "data": p.x = Math.round(R(0, w) / 16) * 16; p.y = init ? R(0, h) : -R(0, 60); p.vy = R(.4, 1.4); p.s = R(1.5, 3); p.a = R(.15, .5); break;
      default: p.x = R(0, w); p.y = init ? R(0, h) : -R(0, 40); p.vx = R(-.25, .35); p.vy = R(.25, .7); p.a = R(.15, .45); if (Math.random() < .7) p.c = "#bdb5a6";
    }
    return p;
  }
  function tick() {
    cx.clearRect(0, 0, w, h);
    parts.forEach((p, i) => {
      if (p.wait > 0) { p.wait--; return; }
      p.t++; p.x += p.vx; p.y += p.vy;
      if (p.m === "embers" || p.m === "ash") p.x += Math.sin(p.t / 45 + p.ph) * .3;
      if (p.y < -90 || p.y > h + 90 || p.x < -90 || p.x > w + 90 || p.t > p.life) { parts[i] = make(i, false); return; }
      const fade = Math.max(0, Math.min(1, p.t / 40, (p.life - p.t) / 40)); let al = p.a * fade;
      cx.globalCompositeOperation = /embers|sparks|data/.test(p.m) ? "lighter" : "source-over"; cx.fillStyle = cx.strokeStyle = p.c;
      if (p.m === "sparks") { cx.globalAlpha = al; cx.lineWidth = p.s; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); cx.stroke(); return; }
      if (p.m === "data") { cx.globalAlpha = al; cx.fillRect(p.x, p.y, p.s, p.s * 2.4); return; }
      if (p.m === "embers") { al *= .65 + .35 * Math.sin(p.t / 6 + p.ph); cx.globalAlpha = al * .18; cx.beginPath(); cx.arc(p.x, p.y, p.s * 3.2, 0, 6.283); cx.fill(); }
      cx.globalAlpha = al; cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
    });
    cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over"; raf = requestAnimationFrame(tick);
  }
  resize(); addEventListener("resize", resize);
  return { set(next) { const s = JSON.stringify(next); if (s === sig) return; sig = s; cfg = next; parts = Array.from({ length: N }, (_, i) => make(i, true)); if (!raf && N) raf = requestAnimationFrame(tick); } };
})();

/* ==========================================================================
   START — URL: #pair/tab/open:id  (pair = "all" or warlord1+warlord2)
   ========================================================================== */
(function init() {
  const note = boot();
  IMG.seed(DATA.meta && DATA.meta.pictures);
  const parts = decodeURIComponent(location.hash.slice(1)).split("/");
  let saved = ""; try { saved = localStorage.getItem("edenCodex.pair") || ""; } catch (e) {}
  readPair(parts[0] ? (parts[0] === "all" ? "" : parts[0]) : saved);
  if (DATA.tabs.some(t => t.id === parts[1])) state.tab = parts[1];
  SFX.sync(); renderAll();
  const open = (parts[2] || "").replace(/^open:/, "");
  if (open) { quiet = true; if (WEAPON(open)) openWeapon(open); else if (ARMOUR(open)) openArmour(open); else if (STATUS(open)) openStatus(open); quiet = false; }
  if (note) toast(note);
})();
</script>
