const PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
/* ---------- Pictures: Name.jpg, Name1.jpg, Name2.jpg … — click a picture to cycle the shortlist ---------- */
const IMG = (() => {
  const EXT = ["jpg", "png", "webp", "jpeg"];
  const EMB = window.EDEN_IMAGES || null;
  const KEY = "edenCodex.pictures";
  const cache = {};
  let pick = {};
  try { pick = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const stemOf = p => String(p || "").replace(/\.(jpe?g|png|webp)$/i, "");
  const src = p => (EMB && EMB[p]) || encodeURI(p).replace(/#/g, "%23");
  const probe = p => new Promise(res => {
    if (EMB) return res(!!EMB[p]);
    const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src(p);
  });
  async function at(stem, n) { for (const e of EXT) { const p = `${stem}${n || ""}.${e}`; if (await probe(p)) return p; } return null; }
  function list(stem) {
    if (!cache[stem]) cache[stem] = (async () => {
      const out = [], first = await at(stem, 0);
      if (first) out.push(first);
      for (let n = 1; n < 40; n++) { const p = await at(stem, n); if (!p) break; out.push(p); }
      return out;
    })();
    return cache[stem];
  }
  function badge(img, i, n) {
    const host = img.parentNode; if (!host) return;
    let b = host.querySelector(":scope > .pic-count");
    if (n < 2) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement("span"); b.className = "pic-count"; host.appendChild(b); }
    b.textContent = `${i + 1} / ${n} · click to cycle`;
  }
  async function hydrate(img) {
    if (img.dataset.ready) return;
    img.dataset.ready = "1";
    const stem = img.dataset.stem, paths = await list(stem);
    if (!paths.length) { img.remove(); return; }
    const i = (pick[stem] || 0) % paths.length;
    img.onload = () => { if (img.parentNode) img.parentNode.classList.add("has-img"); };
    img.src = src(paths[i]);
    if (img.hasAttribute("data-cycle")) badge(img, i, paths.length);
  }
  async function cycle(img) {
    const stem = img.dataset.stem, paths = await list(stem);
    const file = stem.split("/").pop();
    if (paths.length < 2) { toast(`Only one picture — add ${file}1.jpg, ${file}2.jpg… to shortlist more`); return; }
    const i = ((pick[stem] || 0) + 1) % paths.length;
    pick[stem] = i;
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {}
    document.querySelectorAll(`img[data-stem="${CSS.escape(stem)}"]`).forEach(x => { x.src = src(paths[i]); if (x.hasAttribute("data-cycle")) badge(x, i, paths.length); });
    SFX.play("shutter");
    toast(`Picture ${i + 1} of ${paths.length} — ${paths[i].split("/").pop()}`);
  }
  document.addEventListener("click", e => {
    const img = e.target.closest && e.target.closest("img[data-cycle]");
    if (!img) return;
    e.stopPropagation(); e.preventDefault();
    cycle(img);
  }, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.matches("img[data-stem]")) hydrate(n);
    n.querySelectorAll("img[data-stem]").forEach(hydrate);
  }))).observe(document.documentElement, { childList: true, subtree: true });
  return {
    tag: (path, cycleIt, alt) => `<img data-stem="${esc(stemOf(path))}"${cycleIt ? " data-cycle" : ""} alt="${esc(alt || "")}">`,
    hint: path => `add “${path}” — or ${stemOf(path).split("/").pop()}1, 2, 3… to shortlist`,
    snapshot: () => Object.assign({}, pick),
    seed: obj => { if (obj) Object.entries(obj).forEach(([k, v]) => { if (!(k in pick)) pick[k] = v; }); }
  };
})();

const STORE_KEY = "warlordsOfEden.v2";
const LEGACY_KEYS = ["warlordsOfEden.data.v1", "pagesOfEden.data.v1"];
const clone = o => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
let fileRev = "factory", bootNote = "";
let DATA = loadData();

function readBaked() { try { const t = document.getElementById("codex-baked").textContent.trim(); return t && t !== "null" ? JSON.parse(t) : null; } catch (e) { return null; } }
function loadData() {
  const file = readBaked() || clone(DEFAULT_DATA);
  fileRev = (file.meta && file.meta.dataRev) || "factory";
  let data = file;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s.basedOn === fileRev && s.data) { data = s.data; bootNote = "Loaded your browser edits"; }
      else { localStorage.setItem(STORE_KEY + ".archived", raw); localStorage.removeItem(STORE_KEY); bootNote = "This file was updated — older browser edits archived"; }
    }
    LEGACY_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) { localStorage.setItem(k + ".archived", v); localStorage.removeItem(k); bootNote = bootNote || "Older browser edits archived — this file has newer content"; } });
  } catch (e) {}
  data.trees = data.trees || {}; data.bonds = data.bonds || {};
  return data;
}
function saveData() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ basedOn: fileRev, data: DATA })); } catch (e) {} }
async function saveHtml() {
  const re = /(<script type="application\/json" id="codex-baked">)[\s\S]*?(<\/script>)/;
  const now = new Date();
  DATA.meta.dataRev = "save-" + now.toISOString(); DATA.meta.updated = now.toISOString().slice(0, 10); DATA.meta.pictures = IMG.snapshot();
  const html = PRISTINE_HTML.replace(re, (m, a, b) => a + JSON.stringify(DATA).replace(/</g, "\\u003c") + b);
  let done = false;
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName: "Warlords of Eden.html", types: [{ description: "HTML page", accept: { "text/html": [".html"] } }] });
      const w = await h.createWritable(); await w.write(html); await w.close(); done = true;
    } catch (e) { if (e && e.name === "AbortError") return; }
  }
  if (!done) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = "Warlords of Eden.html"; a.click(); }
  fileRev = DATA.meta.dataRev; saveData(); SFX.play("save");
  toast(done ? "Saved into the HTML file" : "Downloaded — replace the old HTML with it");
}

function commit(next) {
  navHistory.push({ w1: state.w1, w2: state.w2, tab: state.tab, skillView: state.skillView });
  if (navHistory.length > 60) navHistory.shift();
  Object.assign(state, next);
  renderAll();
}
function goBack() {
  const s = navHistory.pop();
  if (s) { SFX.play("back"); Object.assign(state, s); renderAll(); }
}
function go(tab, extra) {
  if (tab === state.tab && !extra) return;
  SFX.play("tab", { pitch: 1 + ["profile", "skills", "tech", "buildings"].indexOf(tab) * 0.06 });
  commit(Object.assign({ tab }, extra || {}));
}
function loadDuo(id) {
  const d = D(id); if (!d || !d.warlords.length) return;
  closeModal(true);
  SFX.play("duoLoad");
  commit({ w1: d.warlords[0], w2: d.warlords[1] || d.warlords[0] });
}
function choose(slot, id) {
  const p = pairInfo();
  let w1 = state.w1, w2 = state.w2;
  if (id === "hive") { w1 = w2 = "hive"; }
  else if (p.hive) { if (slot === 1) { w1 = id; w2 = partnerOf(id); } else { w2 = id; w1 = partnerOf(id); } }
  else if (slot === 1) { w1 = id; } else { w2 = id; }
  closeModal(true);
  const mixed = id !== "hive" && W(w1).duo !== W(w2).duo;
  SFX.play(mixed ? "duoLoad" : "select", { pitch: mixed ? 0.92 : 1 });
  commit({ w1, w2 });
}

function treeMeta(view) {
  const p = pairInfo();
  if (view === "w1" || view === "w2") {
    const w = view === "w1" ? p.w1 : p.w2;
    return { key: "w-" + w.id, kicker: `${D(w.duo).name} · Personal tree`, title: `${w.name} — Personal Skill Tree`,
      note: "Branches follow the personal trait plan: Troop, Technology, Passive.", branches: ["Troop", "Technology", "Passive"],
      colors: [warlordAccent(w), warlordAccent(w), warlordAccent(w)], hints: w.traits.map(t => t.desc.replace(/^Placeholder\s*[–-]\s*/i, "")), extraCap: false };
  }
  if (p.mixed) {
    const [a, b] = [p.d1, p.d2].sort((x, y) => x.id.localeCompare(y.id));
    const combos = a.warlords.length * b.warlords.length;
    return { key: `m-${a.id}+${b.id}`, kicker: "Mixed Bond tree", title: `${a.name} × ${b.name} — Mixed Bond Tree`,
      note: `Shared by every ${a.name} × ${b.name} pairing (${combos} combinations), whichever Warlords are chosen.`,
      branches: [`${a.name} Edge`, "Flexibility", `${b.name} Edge`], colors: [a.theme.a, "#bdb5a6", b.theme.a], hints: ["", "", ""], extraCap: false };
  }
  const d = p.d1;
  return { key: "d-" + d.id, kicker: p.hive ? "Hive tree" : "Natural Duo tree", title: `${d.name} — ${p.hive ? "Hive" : "Natural Duo"} Tree`,
    note: p.hive ? "The Hive's single, unmixable tree." : "The full specialised Bond tree — only available to the matched pair.",
    branches: d.treeBranches, colors: [d.theme.a, d.theme.a, d.theme.a], hints: ["", "", ""], extraCap: true };
}

function getTree(meta) {
  if (DATA.trees[meta.key]) return DATA.trees[meta.key];
  const nodes = []; let n = 0;
  const mk = (branch, tier, req, hint) => {
    n++;
    const node = { id: "n" + n, name: `Skill Node ${pad(n)}`, branch, tier, req,
      desc: "Placeholder – not locked." + (hint ? ` Branch direction: ${hint}` : ""),
      requirements: "Placeholder", effects: "Placeholder", cost: "Placeholder", locked: false };
    nodes.push(node); return node.id;
  };
  const tops = [];
  for (let b = 0; b < 3; b++) {
    const a = mk(b, 1, [], meta.hints[b]);
    const x = mk(b, 2, [a], meta.hints[b]);
    const y = mk(b, 2, [a], meta.hints[b]);
    tops.push(mk(b, 3, [x, y], meta.hints[b]));
  }
  const cap = mk(-1, 4, tops, "capstone");
  if (meta.extraCap) mk(-1, 5, [cap], "ultimate Bond ability");
  DATA.trees[meta.key] = { nodes };
  return DATA.trees[meta.key];
}

function renderSkills() {
  const p = pairInfo();
  if (p.hive && state.skillView === "w2") state.skillView = "duo";
  const meta = treeMeta(state.skillView);
  const tree = getTree(meta);
  const btns = [["w1", p.w1.name + " — Personal"], ["duo", p.mixed ? "Mixed Bond Tree" : p.hive ? "Hive Tree" : "Natural Duo Tree"]];
  if (!p.hive) btns.push(["w2", p.w2.name + " — Personal"]);
  const nodeHTML = (nd) => {
    const i = tree.nodes.indexOf(nd);
    const color = nd.branch < 0 ? "var(--duo-a)" : meta.colors[nd.branch];
    const sub = nd.branch < 0 ? (nd.tier === 5 ? "Ultimate" : "Capstone") : meta.branches[nd.branch];
    return `<div class="node ${nd.locked ? "" : "placeholder"}" style="--acc:${color}" data-id="${nd.id}" data-req="${nd.req.join(",")}" data-color="${color}" onclick="openSkill('${meta.key}',${i})">
      <div class="n-tier">${roman(nd.tier)}</div><div class="n-name">${esc(nd.name)}</div><div class="n-sub">${esc(sub)}</div></div>`;
  };
  let rows = `<div class="tree-row"><div></div>${meta.branches.map((b, i) => `<div class="branch-head" style="--bc:${meta.colors[i]}">${esc(b)}</div>`).join("")}</div>`;
  for (let t = 1; t <= 3; t++) {
    rows += `<div class="tree-row"><div class="tier-tag">${roman(t)}</div>${[0, 1, 2].map(b => `<div class="cell">${tree.nodes.filter(nd => nd.tier === t && nd.branch === b).map(nodeHTML).join("")}</div>`).join("")}</div>`;
  }
  [4, 5].forEach(t => {
    const caps = tree.nodes.filter(nd => nd.tier === t);
    if (caps.length) rows += `<div class="tree-row"><div class="tier-tag">${roman(t)}</div><div class="cell span">${caps.map(nodeHTML).join("")}</div></div>`;
  });
  $("#view-skills").innerHTML = `
    <div class="subnav">${btns.map(([v, l]) => `<button class="btn ${state.skillView === v ? "active" : ""}" onclick="setSkillView('${v}')">${esc(l)}</button>`).join("")}</div>
    <div class="tree-head"><div class="kicker">${esc(meta.kicker)}</div><h2>${esc(meta.title)}</h2><p>${esc(meta.note)}</p></div>
    <div class="tree-scroll"><div class="tree" id="tree"><svg class="links"></svg>${rows}</div></div>
    <p class="foot" style="text-align:center">Click any node for details. All nodes are placeholders until marked locked.</p>`;
  requestAnimationFrame(drawLinks);
}
function setSkillView(v) { if (v !== state.skillView) { SFX.play("tab", { pitch: 1.08 }); commit({ skillView: v }); } }

function drawLinks() {
  const tree = $("#tree");
  if (!tree || !tree.offsetParent) return;
  const svg = tree.querySelector("svg.links");
  const tr = tree.getBoundingClientRect();
  svg.setAttribute("width", tree.scrollWidth);
  svg.setAttribute("height", tree.scrollHeight);
  let paths = "";
  tree.querySelectorAll(".node[data-req]").forEach(el => {
    const reqs = el.dataset.req.split(",").filter(Boolean);
    const r = el.getBoundingClientRect();
    const x2 = r.left + r.width / 2 - tr.left, y2 = r.top - tr.top;
    reqs.forEach(id => {
      const pn = tree.querySelector(`.node[data-id="${id}"]`);
      if (!pn) return;
      const pr = pn.getBoundingClientRect();
      const x1 = pr.left + pr.width / 2 - tr.left, y1 = pr.bottom - tr.top, my = (y1 + y2) / 2;
      paths += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" stroke="${pn.dataset.color}"/>`;
    });
  });
  svg.innerHTML = paths;
}

function openSkill(key, i) {
  SFX.play("node");
  const meta = treeMeta(state.skillView);
  const tree = DATA.trees[key], n = tree.nodes[i], base = `trees.${key}.nodes.${i}`;

    const w = W(id), d = D(w.duo);

      <span class="thumb" style="border-left:3px solid ${w.color}">${sigil(d.sigil)}${IMG.tag(portraitPath(w))}</span>

function openModal(html, wide, sfx) {

const PLAIN = (() => { const d = document.createElement("div"); try { d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only"; } catch (e) { return false; } })();
function applyEditable() {
  document.querySelectorAll("[data-edit]").forEach(el => {
    if (state.editing) { el.setAttribute("contenteditable", PLAIN ? "plaintext-only" : "true"); el.spellcheck = true; }
    else el.removeAttribute("contenteditable");
  });
}
function toggleEdit() {
  state.editing = !state.editing;
  document.body.classList.toggle("editing", state.editing);
  $("#btn-edit").classList.toggle("active", state.editing);
  SFX.play("tab", { pitch: state.editing ? 1.15 : 0.88 });
  renderAll();
  toast(state.editing ? "Edit mode on" : "Edit mode off");
}
function persist(msg) { saveData(); if (msg) toast(msg); }
function refresh() { if (reopen) reopen(); else renderAll(); }
function toggleLock(obj) { obj.locked = !obj.locked; persist(obj.locked ? "Marked locked" : "Marked placeholder"); refresh(); }
function toggleTraitLock(wid, i) { toggleLock(W(wid).traits[i]); }
function addPoint(did, key, text) { D(did)[key].push(text); persist("Added"); renderAll(); }
function addUpgrade(base) {
  let o = DATA; base.split(".").forEach(k => (o = o[k]));
  (o.upgrades = o.upgrades || []).push("New upgrade – Placeholder"); persist("Added"); refresh();
}
function bumpBond(key, d) { DATA.bonds[key] = Math.max(0, Math.min(5, (DATA.bonds[key] || 0) + d)); persist(); renderAll(); }
function bumpLine(li, d) { const l = DATA.troops[li]; l.level = Math.max(0, Math.min(10, l.level + d)); persist(); renderAll(); refresh(); }
function bumpUnique(did, i, d) { const t = D(did).uniqueTroops[i]; t.level = Math.max(0, Math.min(10, (t.level || 0) + d)); persist(); renderAll(); refresh(); }

document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (!el || !state.editing) return;
  setPath(DATA, el.dataset.edit, el.innerText.replace(/\u00a0/g, " ").trim());
  persist("Saved");
});
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (el && el.isContentEditable) {
    if (e.key === "Enter" && !el.hasAttribute("data-ml")) { e.preventDefault(); el.blur(); }
    if (e.key === "Escape") el.blur();
    return;
  }
  if (e.key === "Escape") return closeModal();
  if ($("#modal").classList.contains("open") || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const tabs = ["profile", "skills", "tech", "buildings"];
  if (e.key >= "1" && e.key <= "4") go(tabs[+e.key - 1]);
});

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "warlords-of-eden-data.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Exported warlords-of-eden-data.json");
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.duos || !d.warlords) throw new Error("bad file");
      d.trees = d.trees || {}; d.bonds = d.bonds || {}; d.meta = d.meta || clone(DEFAULT_DATA.meta);
      DATA = d; persist("Imported"); renderAll();
    } catch (err) { toast("Import failed — not a Warlords of Eden file"); }
  };
  r.readAsText(file);
}
function resetData() {
  if (!confirm("Discard this browser's edits and go back to the content saved in this HTML file?")) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  DATA = readBaked() || clone(DEFAULT_DATA); DATA.trees = DATA.trees || {}; DATA.bonds = DATA.bonds || {};
  renderAll(); toast("Back to the file version");
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

/* ==========================================================================
   ATMOSPHERE — per-Duo particles (embers, ash, spores, sparks, dust, drips, data)
   ========================================================================== */
const FX = (() => {
  const cv = document.getElementById("fx"), cx = cv.getContext("2d");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = reduce ? 0 : 130;
  let w = 0, h = 0, parts = [], cfg = [], sig = "", raf = 0;
  const R = (a, b) => a + Math.random() * (b - a);
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make(i, initial) {
    const c = cfg[i % cfg.length], m = c.mode;
    const p = { m, c: c.color, t: 0, life: R(320, 900), a: R(.3, .85), s: R(1, 2.6), ph: R(0, 6.28), wait: 0, vx: 0, vy: 0 };
    switch (m) {
      case "embers": p.x = R(0, w); p.y = initial ? R(0, h) : h + R(0, 40); p.vx = R(-.2, .2); p.vy = -R(.35, 1.3); break;
      case "ash": p.x = R(0, w); p.y = initial ? R(0, h) : -R(0, 40); p.vx = R(-.25, .35); p.vy = R(.25, .7); p.a = R(.15, .45); if (Math.random() < .7) p.c = "#bdb5a6"; break;
      case "spores": p.x = R(0, w); p.y = R(0, h); p.vx = R(-.15, .15); p.vy = R(-.18, .08); p.s = R(1.5, 4.5); p.a = R(.08, .32); break;
      case "sparks": { p.x = R(0, w); p.y = R(0, h); const an = R(0, 6.28), sp = R(1.5, 4.5); p.vx = Math.cos(an) * sp; p.vy = Math.sin(an) * sp; p.life = R(16, 46); p.s = R(.8, 1.7); p.a = R(.5, 1); p.wait = initial ? R(0, 400) : R(0, 260); break; }
      case "dust": p.x = initial ? R(0, w) : -R(0, 60); p.y = R(0, h); p.vx = R(.8, 2.6); p.vy = R(-.15, .15); p.a = R(.1, .35); p.s = R(.8, 2); break;
      case "drip": p.x = R(0, w); p.y = initial ? R(0, h) : -R(0, 80); p.vy = R(.6, 1.6); p.s = R(1, 2); p.len = R(6, 16); p.a = R(.25, .6); break;
      case "data": p.x = Math.round(R(0, w) / 16) * 16; p.y = initial ? R(0, h) : -R(0, 60); p.vy = R(.4, 1.4); p.s = R(1.5, 3); p.a = R(.15, .5); break;
    }
    return p;
  }
  function tick() {
    cx.clearRect(0, 0, w, h);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.wait > 0) { p.wait--; continue; }
      p.t++; p.x += p.vx; p.y += p.vy;
      if (p.m === "embers") p.x += Math.sin(p.t / 40 + p.ph) * .35;
      if (p.m === "ash") p.x += Math.sin(p.t / 60 + p.ph) * .3;
      if (p.m === "spores") { p.vx = (p.vx + R(-.02, .02)) * .98; p.vy = (p.vy + R(-.02, .02)) * .98; }
      if (p.m === "drip") p.vy += .012;
      if (p.y < -90 || p.y > h + 90 || p.x < -90 || p.x > w + 90 || p.t > p.life) { parts[i] = make(i, false); continue; }
      const fade = Math.max(0, Math.min(1, p.t / 40, (p.life - p.t) / 40));
      let al = p.a * fade;
      cx.globalCompositeOperation = (p.m === "embers" || p.m === "sparks" || p.m === "data") ? "lighter" : "source-over";
      cx.fillStyle = cx.strokeStyle = p.c;
      if (p.m === "embers") {
        al *= .65 + .35 * Math.sin(p.t / 6 + p.ph);
        cx.globalAlpha = al * .18; cx.beginPath(); cx.arc(p.x, p.y, p.s * 3.2, 0, 6.283); cx.fill();
        cx.globalAlpha = al; cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
      } else if (p.m === "sparks") {
        cx.globalAlpha = al; cx.lineWidth = p.s; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); cx.stroke();
      } else if (p.m === "drip") {
        cx.globalAlpha = al; cx.lineWidth = p.s; cx.beginPath(); cx.moveTo(p.x, p.y - p.len); cx.lineTo(p.x, p.y); cx.stroke();
        cx.beginPath(); cx.arc(p.x, p.y, p.s * .9, 0, 6.283); cx.fill();
      } else if (p.m === "data") {
        cx.globalAlpha = al * (.6 + .4 * Math.sin(p.t / 4 + p.ph)); cx.fillRect(p.x, p.y, p.s, p.s * 2.4);
      } else {
        cx.globalAlpha = al; cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
      }
    }
    cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over";
    raf = requestAnimationFrame(tick);
  }
  resize();
  addEventListener("resize", () => { resize(); drawLinks(); });
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && N) raf = requestAnimationFrame(tick); });
  return {
    set(next) {
      const s = JSON.stringify(next);
      if (s === sig) return;
      sig = s; cfg = next;
      parts = Array.from({ length: N }, (_, i) => make(i, true));
      if (!raf && N) raf = requestAnimationFrame(tick);
    }
  };
})();

/* ==========================================================================
   START — reads #warlord1+warlord2/tab from the URL if present
   ========================================================================== */
(function init() {
  const m = decodeURIComponent(location.hash.slice(1)).match(/^([\w]+)\+([\w]+)(?:\/(\w+))?$/);
  if (m && W(m[1]) && W(m[2])) {
    const bothHive = m[1] === "hive" && m[2] === "hive";
    const noHive = m[1] !== "hive" && m[2] !== "hive";
    if (bothHive || (noHive && m[1] !== m[2])) { state.w1 = m[1]; state.w2 = m[2]; }
    if (["profile", "skills", "tech", "buildings"].includes(m[3])) state.tab = m[3];
    if (m[3] === "troops") state.tab = "profile";
  }
  IMG.seed(DATA.meta && DATA.meta.pictures);
  SFX.sync();
  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLinks);
  if (bootNote) toast(bootNote);
})();
