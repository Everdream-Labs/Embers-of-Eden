<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warlords of Eden — Embers of Eden Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="eden-codex.css">
<style>
.edit-only{display:none}
.app.book > .warlord{display:none}
.duo-head{min-height:150px}

/* Team bar — one button per playable team, then the shared pages */
.teambar{display:flex;justify-content:center;align-items:stretch;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.22)}
.tb{--c:#c9a24a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:108px;padding:6px 10px 5px;border:1px solid var(--line-2);
  background:rgba(0,0,0,.3);color:var(--ink-dim);cursor:pointer;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;text-align:center;transition:border-color .15s,color .15s,background .15s}
.tb .crest{display:flex;gap:4px;align-items:flex-end;justify-content:center;color:var(--c)}
.tb .sig{width:20px;height:20px}
.tb .flag{width:13px;height:19px}
.tb small{font-family:var(--font-body);text-transform:none;letter-spacing:.02em;font-size:.68rem;color:var(--ink-faint)}
.tb:hover{color:#fff;border-color:var(--c)}
.tb.active{color:#fff;border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#1c1712),#120f0c);box-shadow:inset 0 -2px 0 var(--c)}
.tb.active small{color:var(--ink-dim)}
.tb-sep{width:1px;background:var(--line-2);margin:4px 6px}

/* Faces in the header when the side columns are hidden */
.head-face{position:absolute;top:50%;transform:translateY(-50%);width:92px;height:92px;border-radius:50%;overflow:hidden;border:2px solid var(--fc);
  box-shadow:0 0 20px -2px var(--fc);background:#13100d;z-index:2;display:grid;place-items:center}
.head-face.l{left:26px} .head-face.r{right:26px}
.head-face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.head-face .sig{width:46px;height:46px;color:var(--fc);opacity:.7}
.head-face.has-img .sig{display:none}

/* Warlord columns */
.epithet{font-family:var(--font-type);color:var(--ink-dim);font-size:.86rem;margin-top:4px;text-align:center}
.lean{border:1px solid var(--line-2);border-left:3px solid var(--acc);background:rgba(0,0,0,.26);padding:9px 12px;font-size:.88rem;text-align:center}
.lean small{display:block;font-family:var(--font-head);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.hive-col{position:relative;height:100%}
.hive-col .void{position:absolute;inset:0}
.hive-rules{list-style:none;margin:6px 0 0;padding:0;max-width:240px;text-align:center}
.hive-rules li{border:1px solid rgba(79,176,255,.35);background:rgba(4,12,22,.7);padding:6px 10px;margin-bottom:6px;font-family:var(--font-head);letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;color:#cfe8ff}

/* Overview */
.ov{max-width:1120px;margin:0 auto}
.ov-pitch{text-align:center;font-size:1.04rem;max-width:780px;margin:0 auto 18px;color:var(--ink)}
.glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.gl{border:1px solid var(--line-2);border-top:2px solid var(--duo-a);background:rgba(0,0,0,.28);padding:10px 12px;text-align:center}
.gl span{display:block;font-family:var(--font-head);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint)}
.gl b{display:block;font-family:var(--font-head);font-weight:600;font-size:1.2rem;letter-spacing:.05em;color:var(--duo-a-t);line-height:1.2;margin-top:4px}
.gl small{display:block;color:var(--ink-dim);font-size:.75rem;margin-top:3px}
.ov-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{position:relative;border:1px solid var(--line-2);background:rgba(0,0,0,.26);padding:14px 16px;margin-bottom:14px}
.ov-two > .card{margin-bottom:0}
.card h3{margin:0 0 10px;text-align:center;font-family:var(--font-head);font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:.8rem;color:var(--duo-a-t)}
.card .foot{text-align:center}
.pc li{padding-right:30px}
.rm{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;border:0;background:#e23d3d;color:#fff;font:700 13px/1 "Segoe UI",sans-serif;cursor:pointer;place-items:center;padding:0}
body.editing .rm.edit-only{display:grid !important}
.cov{display:grid;grid-template-columns:190px 1fr 92px;align-items:center;gap:10px;margin:6px 0;font-size:.82rem}
.cov .nm{text-align:right;color:var(--ink-dim);font-family:var(--font-head);letter-spacing:.1em;text-transform:uppercase;font-size:.7rem}
.cov .bar{position:relative;height:11px;background:rgba(255,255,255,.05);border:1px solid var(--line-2)}
.cov .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bc);box-shadow:0 0 8px color-mix(in srgb,var(--bc) 70%,transparent)}
.cov .bar em{position:absolute;top:-3px;bottom:-3px;left:80%;width:1px;background:rgba(255,255,255,.35)}
.cov .pct{font-family:var(--font-head);letter-spacing:.06em;font-size:.76rem;text-align:left}
.cov.peak .pct{color:var(--good)} .cov.low .pct{color:var(--bad)} .cov.gone .pct{color:var(--ink-faint)}
.cov.total{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)}
.cov.total .nm{color:var(--ink)}
.mech{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mech > div{position:relative;border:1px solid var(--line-2);border-left:3px solid var(--duo-a);background:rgba(0,0,0,.25);padding:10px 30px 10px 12px}
.mech b{display:block;font-family:var(--font-head);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;margin-bottom:3px;color:var(--duo-a-t)}
.mech p{margin:0;font-size:.86rem;color:var(--ink-dim)}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;list-style:none;margin:0;padding:0}
.chiplist li{position:relative;padding:4px 12px;border:1px solid rgba(212,85,63,.45);background:rgba(0,0,0,.3);font-size:.8rem;color:#f0c9bd}
.chiplist li .rm{position:static;display:none;width:16px;height:16px;font-size:11px;margin-left:6px;vertical-align:middle}
body.editing .chiplist li .rm.edit-only{display:inline-grid !important}
.chiplist li.addrow{border:0;background:none;padding:0}
.chiplist .none{border-color:var(--line-2);color:var(--ink-dim)}
.ub{border-left:3px solid var(--duo-a)}
.ub .ub-name{text-align:center;font-family:var(--font-head);font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.ub p{margin:0 0 8px;font-size:.9rem;text-align:center;color:var(--ink-dim)}
.tiers{list-style:none;margin:0;padding:0;counter-reset:t}
.tiers li{position:relative;counter-increment:t;padding:6px 30px 6px 38px;margin-bottom:5px;border:1px dashed var(--line-2);font-size:.86rem;background:rgba(0,0,0,.2)}
.tiers li::before{content:counter(t,upper-roman);position:absolute;left:10px;top:6px;font-family:var(--font-head);color:var(--acc,var(--duo-a-t));font-size:.8rem}
.tiers li.addrow{border:0;background:none;padding:0;text-align:center}
.tiers li.addrow::before{content:none}
.lore summary{cursor:pointer;text-align:center;font-family:var(--font-head);letter-spacing:.22em;text-transform:uppercase;font-size:.8rem;color:var(--duo-a-t);list-style:none}
.lore summary::-webkit-details-marker{display:none}
.lore summary::after{content:"  ▾";color:var(--ink-faint)}
.lore[open] summary::after{content:"  ▴"}
.lore p{font-size:.94rem;margin:10px 0 0}
.lore .sub-title{text-align:center}

/* Disposition bars — 0 hostile · 55 trade · 100 best allies */
.disp{display:grid;grid-template-columns:150px 1fr 128px;gap:12px;align-items:center;margin:9px 0}
.disp .who{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.74rem;color:var(--c);cursor:pointer;background:none;border:0;padding:0}
.disp .who .sig{width:16px;height:16px}
.dtrack{position:relative;height:12px;background:linear-gradient(90deg,#8e2b22,#b5562a 30%,#c9a24a 55%,#7fae4f 80%,#4fbf6a);border:1px solid rgba(255,255,255,.18)}
.dtrack .shade{position:absolute;top:0;bottom:0;right:0;background:rgba(10,9,8,.66)}
.dtrack .thr{position:absolute;top:-5px;bottom:-5px;left:55%;width:2px;background:#fff;opacity:.55}
.dtrack .pin{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%) rotate(45deg);background:#120f0c;border:2px solid #fff;box-shadow:0 0 8px #000}
.disp .val{font-family:var(--font-head);font-size:.76rem;letter-spacing:.08em;text-align:left}
.disp .val i{font-style:normal;color:var(--ink-faint)}
.disp input[type=range]{grid-column:2;width:100%;margin:0;accent-color:var(--c)}
.disp-scale{display:grid;grid-template-columns:150px 1fr 128px;gap:12px;font-family:var(--font-head);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
.disp-scale div{position:relative;height:14px}
.disp-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* Warlords of the Wastes */
.wintro{max-width:820px;margin:0 auto 18px;text-align:center;color:var(--ink-dim);font-size:.95rem}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-width:1120px;margin:0 auto}
.wcard{--c:#c9a24a;border:1px solid var(--line-2);border-top:3px solid var(--c);background:rgba(0,0,0,.3);padding:18px 14px 14px;text-align:center;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.wcard:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 30px -16px var(--c)}
.wcard .bigflag{display:flex;align-items:flex-end;justify-content:center;gap:8px;color:var(--c)}
.wcard .bigflag .flag{width:58px;height:70px;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c) 50%,transparent))}
.wcard .bigflag .sig{width:34px;height:34px;opacity:.8}
.wcard h3{margin:4px 0 0;font-family:var(--font-head);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:1.05rem;color:color-mix(in srgb,var(--c) 70%,#fff)}
.wcard .wm{font-family:var(--font-type);font-size:.84rem;color:var(--ink-dim)}
.wcard .wrel{font-size:.74rem;color:var(--ink-faint);margin-top:4px}
.wcard .wrel b{font-weight:600}
.wcard.generic{border-style:dashed;border-top-style:solid}
.wpics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 16px}
.wpic{position:relative;height:300px;overflow:hidden;background:#13100d;border:1px solid var(--line-2)}
.wpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.wpic.has-img .portrait-fallback{display:none}
.wpic .cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:22px 10px 8px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.88));font-family:var(--font-head);letter-spacing:.14em;text-transform:uppercase}
.wpic .cap small{display:block;font-family:var(--font-body);text-transform:none;letter-spacing:0;color:var(--ink-dim);font-size:.78rem}

/* Skill-tree boards */
.treebar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 14px;text-align:center}
.treebar .pool{font-family:var(--font-head);letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:var(--ink)}
.treebar .pool b{color:var(--good)}
.treebar input[type=number],.treebar select,.m-sel{background:#120f0c;color:var(--ink);border:1px solid var(--line-2);font:500 .8rem var(--font-body);padding:4px 6px;text-align:center}
.treebar input[type=number]{width:84px}
.cov-strip{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 6px;font-size:.8rem;color:var(--ink-dim);text-align:center}
.cov-strip b{color:var(--duo-a-t);font-family:var(--font-head);letter-spacing:.06em}
.tree-scroll{overflow:auto;padding-bottom:6px}
.mtree{position:relative;padding:14px 4px 10px;width:max-content;margin:0 auto}
.mtree svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.mtree svg.links path{fill:none;stroke-width:2;stroke-dasharray:6 5;opacity:.5}
.mt-row{position:relative;display:grid;grid-template-columns:40px repeat(var(--cols),158px);gap:12px;align-items:start;margin-bottom:30px}
.mt-row.head{align-items:end;margin-bottom:22px}
.mt-cell{display:flex;flex-direction:column;align-items:center;gap:16px}
.mtree .tier-tag{padding-top:22px}
.mtree .branch-head{font-size:.7rem;letter-spacing:.16em;line-height:1.3}
.mtree .branch-head small{display:block;font-family:var(--font-body);letter-spacing:.02em;text-transform:none;font-size:.7rem;color:var(--ink-faint);margin-top:2px}
.bh-acts{justify-content:center;gap:4px;margin-top:5px}
body.editing .bh-acts.edit-only{display:flex !important}
.bh-acts .mini{padding:1px 7px;font-size:.62rem}
.mtree .node{width:150px;min-width:0;padding:12px 8px 9px}
body.editing .mtree .node{padding-bottom:34px}
.mtree .node .n-name{font-size:.8rem}
.mtree .node .n-eff{font-size:.68rem;color:var(--ink-dim);line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mtree .node.gated{opacity:.38}
.mtree .node.gated:hover{opacity:.75}
.n-lockt{font-family:var(--font-head);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bad);margin-top:5px}
.dots{display:flex;justify-content:center;gap:4px;margin-top:7px}
.dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--c);background:transparent}
.dots i.on{background:var(--c);box-shadow:0 0 5px var(--c)}
.n-prog{height:4px;margin-top:7px;background:rgba(255,255,255,.08)}
.n-prog i{display:block;height:100%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.n-pts{font-family:var(--font-head);font-size:.6rem;letter-spacing:.1em;color:var(--ink-faint);margin-top:2px}
.mtree .node.done{box-shadow:0 0 0 1px var(--acc),0 0 22px -4px var(--acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 22%,#2a241d),rgba(23,19,16,.97))}
.mtree .node.done .n-pts{color:var(--good)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:1120px;margin:0 auto 10px}
.how .card{margin:0;text-align:center}
.how .card p{margin:0;font-size:.88rem;color:var(--ink-dim)}
.addbranch{display:none;justify-content:center;margin:4px 0 10px}
body.editing .addbranch{display:flex}

/* Buildings */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px 12px;padding-top:8px}
.bgrid .node{min-width:0;padding:14px 10px 10px}
.bnode .n-desc{font-size:.72rem;color:var(--ink-dim);line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bnode .badges{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:7px}
.bnode .badges span{font-family:var(--font-head);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:0 5px;line-height:15px;color:var(--ink-dim)}
.bnode .badges .pw{border-color:#e8c547;color:#f3e08e}
.bnode .badges .wt{border-color:#5ab4d6;color:#a9dcf0}
.bnode .badges .tr{border-color:var(--line-2)}
.bnode.boosted{box-shadow:0 0 0 1px var(--tbd),0 8px 22px -12px var(--tbd)}
.bnode .n-boost{font-family:var(--font-head);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tbd);margin-top:4px}
.bfilter{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0 18px}
.bfilter .btn{--acc:var(--c)}
.cat-title{color:var(--cc) !important}
.m-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;text-align:center;font-size:.85rem;color:var(--ink-dim)}

@media (max-width:1180px){.glance{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr}.head-face{display:none}}
.colony-flag{display:flex;justify-content:center;margin:12px auto 0;width:min(520px,82%)}
.colony-flag:empty{display:none}
.colony-flag .cloth{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#14110e;border:1px solid var(--line-2);box-shadow:0 14px 30px -20px #000}
.colony-flag img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.folk{margin:0 auto 16px;max-width:980px;text-align:center}
.folk .kicker{margin-bottom:4px}
.folk-bar{display:flex;justify-content:center;gap:8px;margin:10px 0 14px}
.folk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.folk-grid.four{grid-template-columns:repeat(4,1fr)}
.folk-card{display:block;width:100%;padding:0 0 10px;background:rgba(0,0,0,.28);border:1px solid var(--line-2);color:var(--ink);cursor:pointer;text-align:center}
.folk-card span{display:block;margin-top:8px;font-family:var(--font-head);letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}
.folk-card .shot{position:relative;aspect-ratio:3/4;overflow:hidden;background:#14110e}
.folk-card img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.folk-view{display:block;width:min(440px,100%);margin:8px auto 0}
@media (max-width:760px){.folk-grid,.folk-grid.four{grid-template-columns:repeat(2,1fr)}}
.sysgrid{grid-template-columns:repeat(3,1fr)}
@media (max-width:1100px){.sysgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.ov-two,.wpics,.sysgrid{grid-template-columns:1fr}.cov,.disp,.disp-scale{grid-template-columns:110px 1fr 70px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="app" id="app">
  <aside class="plate warlord" id="col-1" style="--acc:var(--w1)"></aside>

  <main class="plate center" style="--acc:var(--duo-a)">
    <header class="duo-head">
      <div class="motif a" id="motif-a"></div>
      <div class="motif b" id="motif-b"></div>
      <div id="head-faces"></div>
      <div class="brandrow"><span class="brand"><b>Warlords</b> of Eden</span><nav class="codex-nav" id="codex-nav"></nav></div>
      <div class="head-sigils" id="head-sigils"></div>
      <div class="kicker" id="duo-kicker"></div>
      <h1 class="duo-title" id="duo-title"></h1>
      <div class="duo-sub" id="duo-sub"></div>
      <div class="motto" id="duo-motto"></div>
      <div class="colony-flag" id="colony-flag"></div>
    </header>

    <nav class="teambar" id="teambar"></nav>

    <nav class="navbar">
      <div class="side"><button class="btn" id="btn-back" onclick="goBack()" title="Back (undo last navigation)">&#9666; Back</button></div>
      <div class="tabs" id="tabs"></div>
      <div class="side">
        <button class="btn" id="btn-sound" onclick="SFX.toggleMute()" title="Toggle menu UI sounds">&#9836; Sound</button>
        <button class="btn" id="btn-edit" onclick="toggleEdit()" title="Toggle edit mode">&#9998; Edit</button>
      </div>
    </nav>

    <div class="editbar">
      <span>Edit mode — on tiles, green adds a connected tile in the row below, blue opens the card, red removes it. Dashed text rewrites. Edits auto-save in this browser; <b>Save into HTML</b> writes them into the file.</span>
      <button class="mini save" onclick="saveHtml()">&#128190; Save into HTML</button>
      <button class="mini" onclick="exportData()">Export JSON</button>
      <button class="mini" onclick="document.getElementById('import-file').click()">Import JSON</button>
      <button class="mini" onclick="resetData()">Reset to defaults</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden onchange="importData(this.files[0]);this.value=''">
    </div>

    <div class="views" id="views"><section class="view active" id="view"></section></div>

    <footer class="legend" id="legend"></footer>
  </main>

  <aside class="plate warlord" id="col-2" style="--acc:var(--w2)"></aside>
</div>

<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal plate" id="modal-box">
    <button class="x" onclick="closeModal()" title="Close">&#10005;</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
/* ---------- Pictures: Name.jpg, Name1.jpg, Name2.jpg … — click a picture to cycle the shortlist ---------- */
const IMG = (() => {
  const EXT = ["jpg", "png", "webp", "jpeg"];
  const EMB = window.EDEN_IMAGES || null;
  const KEY = "edenCodex.pictures";
  const cache = {};
  let pick = {};
  try { pick = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const stemOf = p => String(p || "").replace(/\.(jpe?g|png|webp)$/i, "");
  const src = p => (EMB && EMB[p]) || encodeURI(p).replace(/#/g, "%23");
  const probe = p => new Promise(res => {
    if (EMB) return res(!!EMB[p]);
    const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src(p);
  });
  async function at(stem, n) { for (const e of EXT) { const p = `${stem}${n || ""}.${e}`; if (await probe(p)) return p; } return null; }
  function list(stem) {
    if (!cache[stem]) cache[stem] = (async () => {
      const out = [], first = await at(stem, 0);
      if (first) out.push(first);
      for (let n = 1; n < 40; n++) { const p = await at(stem, n); if (!p) break; out.push(p); }
      return out;
    })();
    return cache[stem];
  }
  function badge(img, i, n) {
    const host = img.parentNode; if (!host) return;
    let b = host.querySelector(":scope > .pic-count");
    if (n < 2) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement("span"); b.className = "pic-count"; host.appendChild(b); }
    b.textContent = `${i + 1} / ${n} · click to cycle`;
  }
  async function hydrate(img) {
    if (img.dataset.ready) return;
    img.dataset.ready = "1";
    const stem = img.dataset.stem, paths = await list(stem);
    if (!paths.length) { img.remove(); return; }
    const i = (pick[stem] || 0) % paths.length;
    img.onload = () => { if (img.parentNode) img.parentNode.classList.add("has-img"); };
    img.src = src(paths[i]);
    if (img.hasAttribute("data-cycle")) badge(img, i, paths.length);
  }
  async function cycle(img) {
    const stem = img.dataset.stem, paths = await list(stem);
    const file = stem.split("/").pop();
    if (paths.length < 2) { toast(`Only one picture — add ${file}1.jpg, ${file}2.jpg… to shortlist more`); return; }
    const i = ((pick[stem] || 0) + 1) % paths.length;
    pick[stem] = i;
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {}
    document.querySelectorAll(`img[data-stem="${CSS.escape(stem)}"]`).forEach(x => { x.src = src(paths[i]); if (x.hasAttribute("data-cycle")) badge(x, i, paths.length); });
    SFX.play("shutter");
    toast(`Picture ${i + 1} of ${paths.length} — ${paths[i].split("/").pop()}`);
  }
  document.addEventListener("click", e => {
    const img = e.target.closest && e.target.closest("img[data-cycle]");
    if (!img) return;
    e.stopPropagation(); e.preventDefault();
    cycle(img);
  }, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.matches("img[data-stem]")) hydrate(n);
    n.querySelectorAll("img[data-stem]").forEach(hydrate);
  }))).observe(document.documentElement, { childList: true, subtree: true });
  return {
    tag: (path, cycleIt, alt) => `<img data-stem="${esc(stemOf(path))}"${cycleIt ? " data-cycle" : ""} alt="${esc(alt || "")}">`,
    hint: path => `add “${path}” — or ${stemOf(path).split("/").pop()}1, 2, 3… to shortlist`,
    snapshot: () => Object.assign({}, pick),
    seed: obj => { if (obj) Object.entries(obj).forEach(([k, v]) => { if (!(k in pick)) pick[k] = v; }); }
  };
})();

function buildTree(target, branches, specs, costs) {
  target.branches = branches;
  specs.forEach(([bid, rows]) => {
    const made = [];
    rows.forEach(([tc, name, effect, blocked]) => {
      const tier = +tc[0], chain = tc.slice(1) || "a";
      const prev = made.find(m => m.tier === tier - 1 && m.chain === chain) || made.find(m => m.tier === tier - 1);

/* ==========================================================================
   NAVIGATION
   ========================================================================== */
function commit(next) {
  navHistory.push({ page: state.page, tab: state.tab });
  if (navHistory.length > 60) navHistory.shift();
  Object.assign(state, next);
  renderAll();
}
function goBack() {
  const s = navHistory.pop();
  if (s) { SFX.play("back"); Object.assign(state, s); renderAll(); }
}
function goPage(page) {
  if (page === state.page) return;
  closeModal(true);
  SFX.play(isTeam(page) ? "duoLoad" : "tab", { pitch: 1.04 });
  commit({ page, tab: isTeam(page) ? (isTeam(state.page) ? state.tab : "overview") : "main" });
}
function goTab(tab) {
  if (tab === state.tab) return;
  SFX.play("tab", { pitch: tab === "tree" ? 1.1 : 1 });
  commit({ tab });
}

  applyTheme();

  renderTeambar();
  renderTabs();
  renderColumns();
  renderView();
  renderLegend();
  $("#btn-back").disabled = navHistory.length === 0;
  try { history.replaceState(null, "", "#" + state.page + (isTeam(state.page) ? "/" + state.tab : "")); } catch (e) {}
  applyEditable();
  if (keep) { views.scrollTop = sv; const t2 = $("#tree-scroll"); if (t2) t2.scrollLeft = sl; } else views.scrollTop = 0;

}

/* ==========================================================================
   MASTER TREE — access maths
   ========================================================================== */
function treeOf(kind) { return kind === "player" ? DATA.player : DATA.master; }
function branchOf(tree, id) { return tree.branches.find(b => b.id === id); }
function isCore(b) { return !(b.only && b.only.length); }
function branchOpen(b, team) { return !!b && (isCore(b) || b.only.includes(team)) && !(b.without || []).includes(team); }
function canTake(n, team) { return branchOpen(branchOf(DATA.master, n.branch), team) && !(n.no || []).includes(team); }
function coverage(team) {
  const m = DATA.master;
  const core = m.nodes.filter(n => isCore(branchOf(m, n.branch) || {})).length;
  const taken = m.nodes.filter(n => canTake(n, team)).length;
  return { taken, core, pct: core ? Math.round(taken / core * 100) : 0 };
}
function branchCov(b, team) {
  const ns = DATA.master.nodes.filter(n => n.branch === b.id), t = ns.filter(n => canTake(n, team)).length;
  return { t, n: ns.length, pct: ns.length ? Math.round(t / ns.length * 100) : 0 };
}
function profile(team) {
  return DATA.master.branches.filter(b => isCore(b) || b.only.includes(team)).map(b => ({ b, ...branchCov(b, team), gone: (b.without || []).includes(team) }));
}

function costOf(n) { return parseInt(String(n.cost || "").replace(/[^\d]/g, ""), 10) || 0; }

  return SIM[k] || (SIM[k] = { on: false, pool: kind === "master" ? 3000 : 8000, chunk: "50", inv: {} });

function spent(sim) { return Object.values(sim.inv).reduce((a, b) => a + b, 0); }
function tileActs(editJs, forkJs, removeJs) {

function lockLabel(n, b, team) {

}

  const prog = sim.on ? `<div class="n-prog"><i style="width:${cost ? Math.min(100, inv / cost * 100) : 0}%"></i></div><div class="n-pts">${inv} / ${cost}</div>` : "";
  return `<div class="node mnode ${n.locked ? "" : "placeholder"} ${gated ? "gated" : ""} ${done ? "done" : ""}" style="--acc:${b.color}" data-id="${n.id}" data-req="${(n.req || []).join(",")}" data-color="${b.color}" onclick="nodeClick('${kind}','${n.id}')">

function branchHeadHTML(kind, b, team) {

function toggleSim(kind) { const s = simOf(kind); s.on = !s.on; SFX.play("toggle"); renderAll(); if (s.on) toast("Click a node to pour points into it"); }
function simSet(kind, k, v) { const s = simOf(kind); s[k] = k === "pool" ? Math.max(0, +v || 0) : v; renderAll(); }

function nodeClick(kind, id) {

function invest(kind, id) {
  const tree = treeOf(kind), n = tree.nodes.find(x => x.id === id), sim = simOf(kind), team = state.page;
  if (!n) return;
  if (kind === "master" && !canTake(n, team)) return toast(`${TM(team).name} can't take ${n.name}`);
  const cost = costOf(n), have = sim.inv[id] || 0;
  if (!cost) return toast("Give this node a cost first");
  if (have >= cost) return toast(n.name + " is already full");
  const missing = (n.req || []).map(r => tree.nodes.find(x => x.id === r)).filter(p => p && (kind !== "master" || canTake(p, team)) && (sim.inv[p.id] || 0) < costOf(p));
  if (missing.length) return toast("Fill " + missing.map(p => p.name).join(", ") + " first");
  const left = sim.pool - spent(sim);
  if (left <= 0) return toast("Out of points — raise the pool or reset");
  const want = sim.chunk === "all" ? cost - have : Math.min(+sim.chunk, cost - have);
  const amt = Math.min(want, left);
  sim.inv[id] = have + amt;
  SFX.play("node", { pitch: sim.inv[id] >= cost ? 1.3 : 1 });
  renderAll();
  toast(sim.inv[id] >= cost ? `${n.name} complete` : `${n.name}: ${sim.inv[id]} / ${cost}`);
}

function forkNode(kind, id) {

function removeNode(kind, id) {

  tree.nodes = tree.nodes.filter(x => x.id !== id);

}
function addEntry(kind, bid) {

  tree.nodes.push({ id: uid("n"), name: "New Node", branch: bid, tier: 1, req: [], effect: "Placeholder – what does it do?", desc: "", cost: first ? first.cost : "40 pts", no: [], locked: false });

}
function addBranch(kind) {
  const tree = treeOf(kind), id = uid("b");
  tree.branches.push({ id, name: "New Branch", color: "#bdb5a6", note: "" });
  tree.nodes.push({ id: uid("n"), name: "New Node", branch: id, tier: 1, req: [], effect: "Placeholder – what does it do?", desc: "", cost: kind === "player" ? "20 pts" : "40 pts", no: [], locked: false });

}
function removeBranch(kind, bid) {
  const tree = treeOf(kind), b = branchOf(tree, bid); if (!b) return;
  if (!confirm(`Remove the "${b.name}" branch and all its nodes?`)) return;
  const ids = new Set(tree.nodes.filter(n => n.branch === bid).map(n => n.id));

  tree.nodes.forEach(n => { n.req = (n.req || []).filter(r => !ids.has(r)); });
  tree.branches = tree.branches.filter(x => x.id !== bid);
  closeModal(true); persist("Branch removed"); renderAll();
}
function moveNode(kind, id, field, value) {

  n[field] = field === "tier" ? Math.max(1, Math.min(10, +value)) : value;

/* ==========================================================================
   ATMOSPHERE — per-team particles
   ========================================================================== */
const FX = (() => {

  const R = (a, b) => a + Math.random() * (b - a);
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);

      case "ash": p.x = R(0, w); p.y = initial ? R(0, h) : -R(0, 40); p.vx = R(-.25, .35); p.vy = R(.25, .7); p.a = R(.15, .45); if (Math.random() < .7) p.c = "#bdb5a6"; break;

      case "dust": p.x = initial ? R(0, w) : -R(0, 60); p.y = R(0, h); p.vx = R(.8, 2.6); p.vy = R(-.15, .15); p.a = R(.1, .35); p.s = R(.8, 2); break;
      case "data": p.x = Math.round(R(0, w) / 16) * 16; p.y = initial ? R(0, h) : -R(0, 60); p.vy = R(.4, 1.4); p.s = R(1.5, 3); p.a = R(.15, .5); break;
      default: p.x = R(0, w); p.y = R(0, h); p.vx = R(-.15, .15); p.vy = R(-.18, .08); p.s = R(1.5, 4.5); p.a = R(.08, .32);

  }

      if (p.m === "ash") p.x += Math.sin(p.t / 60 + p.ph) * .3;
      if (p.y < -90 || p.y > h + 90 || p.x < -90 || p.x > w + 90 || p.t > p.life) { parts[i] = make(i, false); continue; }
      const fade = Math.max(0, Math.min(1, p.t / 40, (p.life - p.t) / 40));
      let al = p.a * fade;
      cx.globalCompositeOperation = (p.m === "embers" || p.m === "sparks" || p.m === "data") ? "lighter" : "source-over";
      cx.fillStyle = cx.strokeStyle = p.c;
      if (p.m === "embers") {
        al *= .65 + .35 * Math.sin(p.t / 6 + p.ph);
        cx.globalAlpha = al * .18; cx.beginPath(); cx.arc(p.x, p.y, p.s * 3.2, 0, 6.283); cx.fill();
        cx.globalAlpha = al; cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
      } else if (p.m === "sparks") {
        cx.globalAlpha = al; cx.lineWidth = p.s; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); cx.stroke();
      } else if (p.m === "data") {
        cx.globalAlpha = al * (.6 + .4 * Math.sin(p.t / 4 + p.ph)); cx.fillRect(p.x, p.y, p.s, p.s * 2.4);
      } else {
        cx.globalAlpha = al; cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 6.283); cx.fill();
      }
    }
    cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over";
    raf = requestAnimationFrame(tick);
  }
  resize();
  addEventListener("resize", () => { resize(); drawLinks(); });
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && N) raf = requestAnimationFrame(tick); });
  return {
    set(next) {
      const s = JSON.stringify(next);
      if (s === sig) return;
      sig = s; cfg = next;
      parts = Array.from({ length: N }, (_, i) => make(i, true));
      if (!raf && N) raf = requestAnimationFrame(tick);
    }
  };
})();

/* ==========================================================================
   START — #<team>/<overview|tree>, #wastes, #wastes/<faction>, #player, #buildings
   ========================================================================== */
(function init() {
  const [page, sub] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (PAGES.includes(page)) { state.page = page; state.tab = isTeam(page) ? (sub === "tree" ? "tree" : "overview") : "main"; }
  IMG.seed(DATA.meta && DATA.meta.pictures);
  SFX.sync();
  renderAll();
  if (page === "wastes" && sub && DATA.wastes.factions[sub]) openWaste(sub);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLinks);
  if (bootNote) toast(bootNote);
  window.addEventListener("hashchange", () => {
    const [p, s] = decodeURIComponent(location.hash.slice(1)).split("/");
    if (!PAGES.includes(p)) return;
    const tab = isTeam(p) ? (s === "tree" ? "tree" : "overview") : "main";
    if (p !== state.page || tab !== state.tab) commit({ page: p, tab });
    if (p === "wastes" && s && DATA.wastes.factions[s]) openWaste(s);
  });
})();
</script>
